# Shared PostgreSQL client authentication. Connections that match no line are rejected.
# TYPE  DATABASE        USER                                    ADDRESS METHOD

# Superuser: the container's Unix socket only (database.sh and pg-backup.sh use docker compose exec), never a network.
local   all             postgres                                        trust
host    all             postgres                                all     reject

# Each service role opens only its own database, over the service's internal Docker network.
host    game_feedback   game_feedback,game_feedback_migrator    all     scram-sha-256
host    photo_contest   photo_contest,photo_contest_migrator    all     scram-sha-256
