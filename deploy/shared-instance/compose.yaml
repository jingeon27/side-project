name: side-proxy
services:
  proxy:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    environment:
      GAME_FEEDBACK_DOMAIN: ${GAME_FEEDBACK_DOMAIN:?Set GAME_FEEDBACK_DOMAIN}
      GAME_FEEDBACK_API_DOMAIN: ${GAME_FEEDBACK_API_DOMAIN:?Set GAME_FEEDBACK_API_DOMAIN}
      PHOTO_CONTEST_DOMAIN: ${PHOTO_CONTEST_DOMAIN:?Set PHOTO_CONTEST_DOMAIN}
      PHOTO_CONTEST_API_DOMAIN: ${PHOTO_CONTEST_API_DOMAIN:?Set PHOTO_CONTEST_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      [
        '${SIDE_BIND_ADDRESS:-0.0.0.0}:${SIDE_HTTP_PORT:-80}:80',
        '${SIDE_BIND_ADDRESS:-0.0.0.0}:${SIDE_HTTPS_PORT:-443}:443',
      ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - config:/config
    networks: [game-feedback, photo-contest]
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
networks:
  game-feedback: { external: true, name: '${SIDE_NETWORK_PREFIX:-side}-game-feedback-edge' }
  photo-contest: { external: true, name: '${SIDE_NETWORK_PREFIX:-side}-photo-contest-edge' }
volumes:
  certificates:
  config:
