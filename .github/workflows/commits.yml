name: Commits

# Pull requests are merged with merge commits, so every branch commit lands in develop as written.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check the branch head itself, not the synthetic merge commit GitHub creates for the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reject fixup, WIP, malformed and co-authored commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-branch-commits.ts "origin/$BASE_REF"
