name: Shared instance contract
on:
  workflow_call:
permissions:
  contents: read
jobs:
  shared-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Validate Game Feedback public build settings
        env:
          SITE_URL: ${{ vars.GF_SITE_URL }}
          CONTACT_EMAIL: ${{ vars.GF_CONTACT_EMAIL }}
          DEPLOY_ENABLED: ${{ vars.GF_DEPLOY_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const site = process.env.SITE_URL || 'https://game.bambyul.com';
          const url = new URL(site);
          if (url.origin !== site || url.protocol !== 'https:') throw new Error('GF_SITE_URL must be an HTTPS origin.');
          if (process.env.DEPLOY_ENABLED === 'true' && (!process.env.SITE_URL || !process.env.CONTACT_EMAIL))
            throw new Error('Configure GF_SITE_URL and GF_CONTACT_EMAIL before enabling deployment.');
          const email = process.env.CONTACT_EMAIL || 'contact@bambyul.com';
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Invalid GF_CONTACT_EMAIL.');
          appendFileSync(process.env.GITHUB_ENV, `GF_BUILD_SITE_URL=${site}\nGF_BUILD_CONTACT_EMAIL=${email}\n`);
          JS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            next-cache-gf
            next-cache-pc
          key: next-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: next-cache-${{ runner.os }}-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "next-cache-gf": { "target": "/app/projects/game-feedback/apps/web/.next/cache", "id": "gf-next-cache" },
              "next-cache-pc": { "target": "/app/projects/photo-contest/apps/web/.next/cache", "id": "pc-next-cache" }
            }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/game-feedback/deploy/shared-instance/Dockerfile
          target: api
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-gf-api:${{ github.sha }}
          cache-from: type=gha,scope=game-feedback-api
          cache-to: type=gha,mode=max,scope=game-feedback-api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/game-feedback/deploy/shared-instance/Dockerfile
          target: web
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-gf-web:${{ github.sha }}
          build-args: |
            WEB_ORIGIN=${{ env.GF_BUILD_SITE_URL }}
            GAME_FEEDBACK_CONTACT_EMAIL=${{ env.GF_BUILD_CONTACT_EMAIL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.GF_WEB_SENTRY_DSN }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.GF_AMPLITUDE_API_KEY }}
          cache-from: type=gha,scope=game-feedback-web
          cache-to: type=gha,mode=max,scope=game-feedback-web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/photo-contest/apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-pc-api:${{ github.sha }}
          cache-from: type=gha,scope=photo-contest-api-amd64
          cache-to: type=gha,mode=max,scope=photo-contest-api-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/photo-contest/apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-pc-web:${{ github.sha }}
          build-args: |
            WEB_ORIGIN=${{ vars.PHOTO_CONTEST_SITE_URL || 'https://contest.bambyul.com' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.PHOTO_CONTEST_WEB_SENTRY_DSN }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.PHOTO_CONTEST_AMPLITUDE_API_KEY }}
          cache-from: type=gha,scope=photo-contest-web-amd64
          cache-to: type=gha,mode=max,scope=photo-contest-web-amd64
      - name: Verify both services behind one HTTPS proxy with external database and object storage boundaries
        run: node projects/game-feedback/apps/api/scripts/shared-instance-smoke.mjs "$GITHUB_SHA"
      - name: Archive the exact images verified together
        run: |
          docker save "side-shared-gf-api:$GITHUB_SHA" "side-shared-gf-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/game-feedback.tar.gz"
          docker save "side-shared-pc-api:$GITHUB_SHA" "side-shared-pc-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/photo-contest.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-game-feedback-images-${{ github.sha }}
          path: ${{ runner.temp }}/game-feedback.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest.tar.gz
          retention-days: 1
          compression-level: 0
