name: Blog

on:
  push:
    paths:
      - 'projects/blog/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.nvmrc'
      - '.github/workflows/blog.yml'
  pull_request:
    paths:
      - 'projects/blog/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.nvmrc'
      - '.github/workflows/blog.yml'

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      SITE_URL: http://127.0.0.1:3101
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      # Validate the committed registry before anything regenerates it; later steps run content:generate themselves.
      - name: Validate committed content and SEO registry
        run: yarn workspace @blog/web content:validate
      - run: yarn workspace @blog/web typecheck
      - run: yarn workspace @blog/web lint
      - run: yarn workspace @blog/web test
      - run: yarn workspace @blog/web build
      - run: yarn workspace @blog/web exec playwright install --with-deps chromium
      - run: yarn workspace @blog/web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blog-playwright
          path: |
            projects/blog/apps/web/playwright-report/
            projects/blog/apps/web/test-results/
          if-no-files-found: ignore
