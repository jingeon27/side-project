name: Photo Contest
on:
  push:
    # Branch pushes only: a tag named like the deploy branch must not reach the deployment gate.
    # PHOTO_CONTEST_DEPLOY_BRANCH must be one of these branches.
    branches: [main, develop]
    paths:
      - 'projects/photo-contest/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - 'tsconfig.scripts.json'
      - '.yarnrc.yml'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.dockerignore'
      - '.github/workflows/photo-contest.yml'
      - '.github/workflows/shared-instance.yml'
      - 'deploy/shared-instance/**'
  pull_request:
    paths:
      - 'projects/photo-contest/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - 'tsconfig.scripts.json'
      - '.yarnrc.yml'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.dockerignore'
      - '.github/workflows/photo-contest.yml'
      - '.github/workflows/shared-instance.yml'
      - 'deploy/shared-instance/**'
permissions:
  contents: read
jobs:
  shared-contract:
    uses: ./.github/workflows/shared-instance.yml
    secrets: inherit

  components:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @photo-contest/web test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: photo-contest-component-traces
          path: projects/photo-contest/apps/web/test-results/components/

  containers:
    needs: shared-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/shared-images
      - name: Load images verified by the shared-instance contract
        run: |
          gzip -dc "$RUNNER_TEMP/shared-images/photo-contest.tar.gz" | docker load
          for app in api web; do
            docker tag "side-shared-pc-$app:$GITHUB_SHA" "photo-contest-$app:$GITHUB_SHA"
          done
      - run: yarn workspace @photo-contest/web exec playwright install --with-deps chromium
      - name: Verify the images on the legacy single-host stack and its backup restore
        run: bash projects/photo-contest/apps/web/test/deployment/containers.sh
      - name: Archive the verified images
        if: >-
          github.event_name == 'push' &&
          vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true' &&
          github.ref == format('refs/heads/{0}', vars.PHOTO_CONTEST_DEPLOY_BRANCH)
        run: docker save "photo-contest-api:$GITHUB_SHA" "photo-contest-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/photo-contest-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          github.event_name == 'push' &&
          vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true' &&
          github.ref == format('refs/heads/{0}', vars.PHOTO_CONTEST_DEPLOY_BRANCH)
        with:
          name: photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest-images.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: photo-contest-deployment-traces
          path: projects/photo-contest/apps/web/test-results/deployment/

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: contest, POSTGRES_PASSWORD: contest, POSTGRES_DB: photo_contest_test }
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U contest -d photo_contest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://contest:contest@127.0.0.1:55434/photo_contest_test?schema=public
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Reject incompatible new migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/develop' }}
        run: node scripts/check-migrations.ts
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - id: install
        run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - run: yarn workspace @side/photo-contest codegen
      - name: Check deployment scripts
        run: shellcheck -x deploy/shared-instance/scripts/*.sh projects/photo-contest/deploy/scripts/*.sh projects/photo-contest/apps/web/test/deployment/containers.sh
      - run: yarn format:check
      - run: yarn typecheck:scripts
      - run: yarn workspace @side/config check
      - run: yarn workspace @side/toolkit check
      - run: yarn workspace @side/design-system check
      - run: yarn workspace @side/photo-contest check
      - run: yarn workspace @photo-contest/web lint && yarn workspace @photo-contest/mobile lint
      - run: yarn workspace @photo-contest/api test:integration
      - run: yarn workspace @photo-contest/web test:api
      - run: yarn workspace @photo-contest/mobile test:api
      - run: yarn build:photo-contest
      - name: Check test schema cleanup
        if: always() && steps.install.outcome == 'success'
        run: yarn workspace @photo-contest/test-kit check:cleanup
  browser:
    runs-on: ubuntu-latest
    # Browsers and their system libraries are preinstalled, so the job skips apt. Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, mobile]
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: contest, POSTGRES_PASSWORD: contest, POSTGRES_DB: photo_contest_test }
        options: >-
          --health-cmd "pg_isready -U contest -d photo_contest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      # The job container reaches the service by name; test-kit accepts this host only on GitHub Actions.
      LOCAL_TEST_POSTGRES_PORT: '5432'
      TEST_DATABASE_URL: postgresql://contest:contest@postgres:5432/photo_contest_test?schema=public
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - run: yarn workspace @side/photo-contest codegen
      - run: yarn workspace @photo-contest/${{ matrix.app }} test:e2e
      - name: Verify Web Vitals with intercepted SDK requests
        if: matrix.app == 'web'
        run: yarn workspace @photo-contest/web test:observability
      - name: Verify production public cache
        if: always() && !cancelled() && matrix.app == 'web'
        run: yarn workspace @photo-contest/web test:cache
      - name: Check test schema cleanup
        if: always()
        run: yarn workspace @photo-contest/test-kit check:cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: photo-contest-${{ matrix.app }}-playwright
          path: |
            projects/photo-contest/apps/${{ matrix.app }}/playwright-report/
            projects/photo-contest/apps/${{ matrix.app }}/test-results/
            projects/photo-contest/apps/${{ matrix.app }}/.data/screens/

  publish:
    needs: [verify, browser, components, containers, shared-contract]
    if: >-
      github.event_name == 'push' &&
      vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', vars.PHOTO_CONTEST_DEPLOY_BRANCH)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.push.outputs.api_image }}
      web_image: ${{ steps.push.outputs.web_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest-images
      - name: Image names
        id: images
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-photo-contest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact verified images
        id: push
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        run: |
          gzip -dc "$RUNNER_TEMP/photo-contest-images/photo-contest-images.tar.gz" | docker load
          for app in api web; do
            image="$IMAGE_PREFIX-$app:$GITHUB_SHA"
            docker tag "photo-contest-$app:$GITHUB_SHA" "$image"
            docker push "$image"
            # 로컬 아카이브 이름이 먼저 남을 수 있으므로 방금 push한 저장소의 digest만 선택한다.
            digest=$(docker image inspect --format '{{json .RepoDigests}}' "$image" |
              jq -er --arg repository "${image%:*}" '
                map(select(startswith($repository + "@sha256:"))) | unique |
                if length == 1 then .[0] else error("Expected one digest for the pushed GHCR repository") end')
            echo "${app}_image=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Covers waiting for the other service on the host lock plus one deployment and its rollback.
    # The deployment itself runs detached on the host, so a timeout only stops following it.
    timeout-minutes: 45
    environment: photo-contest-production
    concurrency:
      # Per service: the host flock serializes the two services without cancelling each other's queued job.
      group: shared-instance-deploy-photo-contest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Skip when a newer commit changed this service
        id: latest
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ vars.PHOTO_CONTEST_DEPLOY_BRANCH }}
        run: bash deploy/shared-instance/scripts/ci-superseded.sh photo-contest "$DEPLOY_BRANCH"
      - name: Authenticate the SSM deployment with GitHub OIDC
        if: steps.latest.outputs.deploy == 'true' && vars.SIDE_DEPLOY_SSM_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SIDE_DEPLOY_AWS_ROLE_ARN }}
          role-session-name: side-cd-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.SIDE_DEPLOY_AWS_ACCOUNT_ID }}
      - name: Install the pinned Session Manager plugin
        if: steps.latest.outputs.deploy == 'true' && vars.SIDE_DEPLOY_SSM_INSTANCE_ID != ''
        run: bash deploy/shared-instance/scripts/ci-session-manager.sh
      - name: Deploy verified digests over SSH or SSM
        if: steps.latest.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DEPLOY_SSM_INSTANCE_ID: ${{ vars.SIDE_DEPLOY_SSM_INSTANCE_ID }}
          DEPLOY_AWS_REGION: ap-northeast-2
          DEPLOY_HOST: ${{ vars.SIDE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SIDE_DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.SIDE_DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SIDE_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.SIDE_DEPLOY_SSH_KEY }}
          SERVICE_ENV: ${{ secrets.SERVICE_ENV }}
          SERVICE_ENV_OVERRIDES: ${{ secrets.SERVICE_ENV_OVERRIDES }}
          DEPLOY_WAIT_SECONDS: '2400'
        run: bash deploy/shared-instance/scripts/ci-upload.sh photo-contest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Record web Sentry release through the project webhook
        if: steps.latest.outputs.deploy == 'true'
        env:
          SENTRY_RELEASE_TOKEN: ${{ secrets.PHOTO_CONTEST_WEB_SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT_ID: '4512316658941952'
          SENTRY_PROJECT: photo-contest-web
          SENTRY_RELEASE: ${{ github.sha }}
        run: node deploy/shared-instance/scripts/sentry-release.ts
      - name: Record server Sentry release through the project webhook
        if: steps.latest.outputs.deploy == 'true'
        env:
          SENTRY_RELEASE_TOKEN: ${{ secrets.PHOTO_CONTEST_SERVER_SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT_ID: '4512316662808576'
          SENTRY_PROJECT: photo-contest-server
          SENTRY_RELEASE: ${{ github.sha }}
        run: node deploy/shared-instance/scripts/sentry-release.ts
