        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/shared-instance/scripts/ci-superseded.sh photo-contest main
      - name: Authenticate the SSM deployment with GitHub OIDC
        if: steps.latest.outputs.deploy == 'true' && vars.SIDE_DEPLOY_SSM_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
