# 공용 호스트 검증은 실행당 한 번만 수행하고 PR의 이전 검사만 취소한다.
name: Services
run-name: >-
  Services / ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name == 'main' && 'production' || github.ref_name == 'develop' && 'development' || github.ref_name }} / verify
on:
  push:
    branches:
      - main
      - develop
    paths: &service_paths
      - projects/game-feedback/**
      - projects/photo-contest/**
      - packages/**
      - package.json
      - yarn.lock
      - scripts/**
      - tsconfig.scripts.json
      - .yarnrc.yml
      - .nvmrc
      - .prettierrc.json
      - .prettierignore
      - .dockerignore
      - .github/workflows/services.yml
      - deploy/shared-instance/**
  # PR과 push가 같은 경로를 사용해 블로그만 바뀐 실행은 만들지 않는다.
  pull_request:
    branches: [develop, main]
    paths: *service_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group:
    services-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.run_id }}
  cancel-in-progress: true
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game-feedback: ${{ steps.select.outputs.game-feedback }}
      photo-contest: ${{ steps.select.outputs.photo-contest }}
      production: ${{ steps.select.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - id: select
        run: node deploy/shared-instance/scripts/service-ci.ts select
  shared-contract:
    name: Shared container contract
    needs: selection
    if: needs.selection.outputs['game-feedback'] == 'true' || needs.selection.outputs['photo-contest'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GF_S3_BUCKET: ${{ vars.GAME_FEEDBACK_S3_BUCKET }}
      GF_S3_KEY_PREFIX: ${{ vars.GAME_FEEDBACK_S3_KEY_PREFIX || 'game-feedback/ci' }}
      GF_S3_ACCESS_KEY_ID: ${{ secrets.GAME_FEEDBACK_S3_ACCESS_KEY_ID }}
      GF_S3_SECRET_ACCESS_KEY: ${{ secrets.GAME_FEEDBACK_S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - name: Validate Game Feedback public build settings
        env:
          SITE_URL: ${{ vars.GAME_FEEDBACK_SITE_URL }}
          CONTACT_EMAIL: ${{ vars.GAME_FEEDBACK_CONTACT_EMAIL }}
          DEPLOY_ENABLED: ${{ vars.GAME_FEEDBACK_DEPLOY_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const site = process.env.SITE_URL || 'https://game.bambyul.com';
          const url = new URL(site);
          if (url.origin !== site || url.protocol !== 'https:') throw new Error('GAME_FEEDBACK_SITE_URL must be an HTTPS origin.');
          if (process.env.DEPLOY_ENABLED === 'true' && (!process.env.SITE_URL || !process.env.CONTACT_EMAIL))
            throw new Error('Configure GAME_FEEDBACK_SITE_URL and GAME_FEEDBACK_CONTACT_EMAIL before enabling deployment.');
          const email = process.env.CONTACT_EMAIL || 'contact@bambyul.com';
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Invalid GAME_FEEDBACK_CONTACT_EMAIL.');
          appendFileSync(process.env.GITHUB_ENV, `GF_BUILD_SITE_URL=${site}\nGF_BUILD_CONTACT_EMAIL=${email}\n`);
          JS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            next-cache-gf
            next-cache-pc
          key: next-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: next-cache-${{ runner.os }}-
      # 캐시는 빌드 속도용이다. 검증이 끝난 뒤 사후 단계의 저장이 디스크 부족으로 실패해도 결과를 바꾸지 않는다.
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        continue-on-error: true
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "next-cache-gf": { "target": "/app/projects/game-feedback/apps/web/.next/cache", "id": "gf-next-cache" },
              "next-cache-pc": { "target": "/app/projects/photo-contest/apps/web/.next/cache", "id": "pc-next-cache" }
            }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/game-feedback/deploy/shared-instance/Dockerfile
          target: api
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-gf-api:${{ github.sha }}
          cache-from: type=gha,scope=game-feedback-api
          cache-to: type=gha,mode=max,scope=game-feedback-api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/game-feedback/deploy/shared-instance/Dockerfile
          target: web
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-gf-web:${{ github.sha }}
          build-args: |
            WEB_ORIGIN=${{ env.GF_BUILD_SITE_URL }}
            GAME_FEEDBACK_CONTACT_EMAIL=${{ env.GF_BUILD_CONTACT_EMAIL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.GAME_FEEDBACK_WEB_SENTRY_DSN }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.GAME_FEEDBACK_AMPLITUDE_API_KEY }}
          cache-from: type=gha,scope=game-feedback-web
          cache-to: type=gha,mode=max,scope=game-feedback-web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/photo-contest/apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-pc-api:${{ github.sha }}
          cache-from: type=gha,scope=photo-contest-api-amd64
          cache-to: type=gha,mode=max,scope=photo-contest-api-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: projects/photo-contest/apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: side-shared-pc-web:${{ github.sha }}
          build-args: |
            WEB_ORIGIN=${{ vars.PHOTO_CONTEST_SITE_URL || 'https://contest.bambyul.com' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.PHOTO_CONTEST_WEB_SENTRY_DSN }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.PHOTO_CONTEST_AMPLITUDE_API_KEY }}
          cache-from: type=gha,scope=photo-contest-web-amd64
          cache-to: type=gha,mode=max,scope=photo-contest-web-amd64
      - name: Verify both services behind one HTTPS proxy with external database and object storage boundaries
        run: node projects/game-feedback/apps/api/scripts/shared-instance-smoke.ts "$GITHUB_SHA"
      - name: Keep numeric replacement and database recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-instance-verification-${{ github.sha }}
          path: projects/game-feedback/.data/shared-instance-verification.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Archive the exact images verified together
        run: |
          docker save "side-shared-gf-api:$GITHUB_SHA" "side-shared-gf-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/game-feedback.tar.gz"
          docker save "side-shared-pc-api:$GITHUB_SHA" "side-shared-pc-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/photo-contest.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-game-feedback-images-${{ github.sha }}
          path: ${{ runner.temp }}/game-feedback.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Report runner disk before saving the build cache
        if: always()
        run: df -h /
  gf-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Reject incompatible new migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/develop' }}
        run: node scripts/check-migrations.ts
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - id: install
        run: yarn install --immutable
      - run: yarn format:check
      - run: yarn typecheck:scripts
      - run: yarn workspace @side/game-feedback codegen
      - name: Check generated SDK
        run: git diff --exit-code -- projects/game-feedback/packages/sdk/src/generated
      - run: yarn workspace @side/design-system check
      - run: yarn check:game-feedback
      - run: yarn workspace @side/config check
      - run: yarn workspace @side/toolkit check
      - run: yarn workspace @side/game-feedback test:unit
    name: GF static and unit
    needs: selection
    if: needs.selection.outputs['game-feedback'] == 'true'
  gf-integration:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 35
    env:
      GF_S3_BUCKET: ${{ vars.GAME_FEEDBACK_S3_BUCKET }}
      GF_S3_REGION: ap-northeast-2
      GF_S3_KEY_PREFIX: ${{ vars.GAME_FEEDBACK_S3_KEY_PREFIX || 'game-feedback/ci' }}
      GF_S3_ACCESS_KEY_ID: ${{ secrets.GAME_FEEDBACK_S3_ACCESS_KEY_ID }}
      GF_S3_SECRET_ACCESS_KEY: ${{ secrets.GAME_FEEDBACK_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - id: install
        run: yarn install --immutable
      - run: yarn workspace @side/game-feedback codegen
      - run: yarn workspace @game-feedback/api test:integration
      - run: yarn build:game-feedback
      - run: yarn workspace @side/game-feedback test:e2e
      - name: Verify telemetry with intercepted SDK requests
        if: always() && !cancelled() && steps.install.outcome == 'success'
        env:
          GF_OBSERVABILITY_PRODUCTION: 'true'
        run: yarn workspace @game-feedback/web test:observability
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: game-feedback-playwright
          path: |
            projects/game-feedback/apps/web/test-results
            projects/game-feedback/apps/web/.e2e-build/observability-results
            projects/game-feedback/apps/web/.e2e-build/test-auth-results
            projects/game-feedback/apps/web/.e2e-build/prefetch-results
            projects/game-feedback/apps/admin/test-results
            projects/game-feedback/apps/mobile/test-results
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Stop owned test database
        if: always() && steps.install.outcome == 'success'
        run: yarn workspace @side/game-feedback db:test:stop
    name: GF integration and browsers
    needs: selection
    if: needs.selection.outputs['game-feedback'] == 'true'
  gf-components:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @game-feedback/contracts build
      - run: yarn workspace @game-feedback/admin test:browser
      - run: yarn workspace @side/design-system test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: game-feedback-component-traces
          path: |
            projects/game-feedback/apps/admin/test-results/
            packages/design-system/test-results/
    name: GF components
    needs: selection
    if: needs.selection.outputs['game-feedback'] == 'true'
  pc-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contest
          POSTGRES_PASSWORD: contest
          POSTGRES_DB: photo_contest_test
        ports:
          - 55434:5432
        options:
          --health-cmd "pg_isready -U contest -d photo_contest_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://contest:contest@127.0.0.1:55434/photo_contest_test?schema=public
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Reject incompatible new migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/develop' }}
        run: node scripts/check-migrations.ts
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - id: install
        run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - run: yarn workspace @side/photo-contest codegen
      - name: Check deployment scripts
        run: shellcheck -x deploy/shared-instance/scripts/*.sh projects/photo-contest/deploy/scripts/*.sh
          projects/photo-contest/apps/web/test/deployment/containers.sh
      - run: yarn format:check
      - run: yarn typecheck:scripts
      - run: yarn workspace @side/config check
      - run: yarn workspace @side/toolkit check
      - run: yarn workspace @side/design-system check
      - run: yarn workspace @side/photo-contest check
      - run: yarn workspace @photo-contest/web lint && yarn workspace @photo-contest/mobile lint
      - run: yarn workspace @photo-contest/api test:integration
      - run: yarn workspace @photo-contest/web test:api
      - run: yarn workspace @photo-contest/mobile test:api
      - run: yarn build:photo-contest
      - name: Check test schema cleanup
        if: always() && steps.install.outcome == 'success'
        run: yarn workspace @photo-contest/test-kit check:cleanup
    name: PC static and integration
    needs: selection
    if: needs.selection.outputs['photo-contest'] == 'true'
  pc-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - web
          - mobile
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contest
          POSTGRES_PASSWORD: contest
          POSTGRES_DB: photo_contest_test
        options:
          --health-cmd "pg_isready -U contest -d photo_contest_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      LOCAL_TEST_POSTGRES_PORT: '5432'
      TEST_DATABASE_URL: postgresql://contest:contest@postgres:5432/photo_contest_test?schema=public
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - run: yarn workspace @side/photo-contest codegen
      - run: yarn workspace @photo-contest/${{ matrix.app }} test:e2e
      - name: Verify Web Vitals with intercepted SDK requests
        if: matrix.app == 'web'
        run: yarn workspace @photo-contest/web test:observability
      - name: Verify production public cache
        if: always() && !cancelled() && matrix.app == 'web'
        run: yarn workspace @photo-contest/web test:cache
      - name: Check test schema cleanup
        if: always()
        run: yarn workspace @photo-contest/test-kit check:cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: photo-contest-${{ matrix.app }}-playwright
          path: |
            projects/photo-contest/apps/${{ matrix.app }}/playwright-report/
            projects/photo-contest/apps/${{ matrix.app }}/test-results/
            projects/photo-contest/apps/${{ matrix.app }}/.data/screens/
    name: PC browser (${{ matrix.app }})
    needs: selection
    if: needs.selection.outputs['photo-contest'] == 'true'
  pc-components:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @photo-contest/web test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: photo-contest-component-traces
          path: projects/photo-contest/apps/web/test-results/components/
    name: PC components
    needs: selection
    if: needs.selection.outputs['photo-contest'] == 'true'
  pc-containers:
    needs:
      - selection
      - shared-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      S3_BUCKET: ${{ vars.PHOTO_CONTEST_S3_BUCKET }}
      S3_REGION: ap-northeast-2
      S3_KEY_PREFIX: ${{ vars.PHOTO_CONTEST_S3_KEY_PREFIX || 'photo-contest/ci' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PHOTO_CONTEST_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PHOTO_CONTEST_S3_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PHOTO_CONTEST_S3_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - run: yarn install --immutable
      - run: yarn workspace @side/photo-contest db:generate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shared-photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/shared-images
      - name: Load images verified by the shared-instance contract
        run: |
          gzip -dc "$RUNNER_TEMP/shared-images/photo-contest.tar.gz" | docker load
          for app in api web; do
            docker tag "side-shared-pc-$app:$GITHUB_SHA" "photo-contest-$app:$GITHUB_SHA"
          done
      - run: yarn workspace @photo-contest/web exec playwright install --with-deps chromium
      - name: Verify the images on the legacy single-host stack and its backup restore
        run: bash projects/photo-contest/apps/web/test/deployment/containers.sh
      - name: Archive the verified images
        if: needs.selection.outputs.production == 'true' && vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true'
        run: docker save "photo-contest-api:$GITHUB_SHA" "photo-contest-web:$GITHUB_SHA" | gzip -1 >
          "$RUNNER_TEMP/photo-contest-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.selection.outputs.production == 'true' && vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true'
        with:
          name: photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest-images.tar.gz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: photo-contest-deployment-traces
          path: projects/photo-contest/apps/web/test-results/deployment/
    name: PC containers and restore
    if: needs.selection.outputs['photo-contest'] == 'true'
  verification:
    name: Service verification
    needs:
      - selection
      - shared-contract
      - gf-verify
      - gf-integration
      - gf-components
      - pc-verify
      - pc-browser
      - pc-components
      - pc-containers
    if: always() && needs.selection.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Require every selected check and summarize failures
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node deploy/shared-instance/scripts/service-ci.ts verify
  gf-publish:
    needs:
      - selection
      - verification
    if: needs.selection.outputs.production == 'true' && needs.selection.outputs['game-feedback'] == 'true' && vars.GAME_FEEDBACK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.push.outputs.api_image }}
      web_image: ${{ steps.push.outputs.web_image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shared-game-feedback-images-${{ github.sha }}
          path: ${{ runner.temp }}/shared-images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact verified images
        id: push
        env:
          IMAGE_PREFIX: ghcr.io/jingeon27/side-project-game-feedback
        run: |
          gzip -dc "$RUNNER_TEMP/shared-images/game-feedback.tar.gz" | docker load
          for app in api web; do
            image="$IMAGE_PREFIX-$app:$GITHUB_SHA"
            docker tag "side-shared-gf-$app:$GITHUB_SHA" "$image"
            docker push "$image"
            # 로컬 아카이브 이름이 먼저 남을 수 있으므로 방금 push한 저장소의 digest만 선택한다.
            digest=$(docker image inspect --format '{{json .RepoDigests}}' "$image" |
              jq -er --arg repository "${image%:*}" '
                map(select(startswith($repository + "@sha256:"))) | unique |
                if length == 1 then .[0] else error("Expected one digest for the pushed GHCR repository") end')
            echo "${app}_image=$digest" >> "$GITHUB_OUTPUT"
          done
    name: GF publish
  gf-deploy:
    needs: [selection, gf-publish]
    if: needs.selection.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: game-feedback-production
    concurrency:
      group: shared-instance-deploy-game-feedback
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Skip when a newer commit changed this service
        id: latest
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/shared-instance/scripts/ci-superseded.sh game-feedback main
      - name: Authenticate the SSM deployment with GitHub OIDC
        if: steps.latest.outputs.deploy == 'true' && vars.SIDE_DEPLOY_SSM_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.SIDE_DEPLOY_AWS_ROLE_ARN }}
          role-session-name: side-cd-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.SIDE_DEPLOY_AWS_ACCOUNT_ID }}
      - name: Install the pinned Session Manager plugin
        if: steps.latest.outputs.deploy == 'true' && vars.SIDE_DEPLOY_SSM_INSTANCE_ID != ''
        run: bash deploy/shared-instance/scripts/ci-session-manager.sh
      - name: Deploy the tested image digests to the shared host
        if: steps.latest.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          API_IMAGE: ${{ needs['gf-publish'].outputs.api_image }}
          WEB_IMAGE: ${{ needs['gf-publish'].outputs.web_image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DEPLOY_SSM_INSTANCE_ID: ${{ vars.SIDE_DEPLOY_SSM_INSTANCE_ID }}
          DEPLOY_AWS_REGION: ap-northeast-2
          DEPLOY_HOST: ${{ vars.SIDE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SIDE_DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.SIDE_DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SIDE_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.SIDE_DEPLOY_SSH_KEY }}
          SERVICE_ENV: ${{ secrets.SERVICE_ENV }}
          SERVICE_ENV_OVERRIDES: ${{ secrets.SERVICE_ENV_OVERRIDES }}
          DEPLOY_WAIT_SECONDS: '2400'
        run: bash deploy/shared-instance/scripts/ci-upload.sh game-feedback
      - name: Record web Sentry release through the project webhook
        if: steps.latest.outputs.deploy == 'true'
        env:
          SENTRY_RELEASE_TOKEN: ${{ secrets.GAME_FEEDBACK_WEB_SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT_ID: '4512287252611072'
          SENTRY_PROJECT: game-feedback
          SENTRY_RELEASE: ${{ github.sha }}
        run: node deploy/shared-instance/scripts/sentry-release.ts
      - name: Record server Sentry release through the project webhook
        if: steps.latest.outputs.deploy == 'true'
        env:
          SENTRY_RELEASE_TOKEN: ${{ secrets.GAME_FEEDBACK_SERVER_SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT_ID: '4512316316385280'
          SENTRY_PROJECT: game-feedback-server
          SENTRY_RELEASE: ${{ github.sha }}
        run: node deploy/shared-instance/scripts/sentry-release.ts
    name: GF deploy
  pc-publish:
    needs:
      - selection
      - verification
    if: needs.selection.outputs.production == 'true' && needs.selection.outputs['photo-contest'] == 'true' && vars.PHOTO_CONTEST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.push.outputs.api_image }}
      web_image: ${{ steps.push.outputs.web_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: photo-contest-images-${{ github.sha }}
          path: ${{ runner.temp }}/photo-contest-images
      - name: Image names
        id: images
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-photo-contest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact verified images
        id: push
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        run: |
          gzip -dc "$RUNNER_TEMP/photo-contest-images/photo-contest-images.tar.gz" | docker load
          for app in api web; do
            image="$IMAGE_PREFIX-$app:$GITHUB_SHA"
            docker tag "photo-contest-$app:$GITHUB_SHA" "$image"
            docker push "$image"
            # 로컬 아카이브 이름이 먼저 남을 수 있으므로 방금 push한 저장소의 digest만 선택한다.
            digest=$(docker image inspect --format '{{json .RepoDigests}}' "$image" |
              jq -er --arg repository "${image%:*}" '
                map(select(startswith($repository + "@sha256:"))) | unique |
                if length == 1 then .[0] else error("Expected one digest for the pushed GHCR repository") end')
            echo "${app}_image=$digest" >> "$GITHUB_OUTPUT"
          done
    name: PC publish
