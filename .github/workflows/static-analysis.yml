name: Static analysis
run-name: >-
  Static analysis / ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name == 'main' && 'production' || github.ref_name == 'develop' && 'development' || github.ref_name }}

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      ENVIRONMENT: test
      APP_VARIANT: development
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the actual PR branch commits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-branch-commits.ts "$PR_BASE_SHA" "$PR_HEAD_SHA"
      - name: Select Terraform verification
        id: terraform
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git diff --quiet "$BASE_SHA" HEAD -- deploy/shared-instance/terraform .github/workflows/static-analysis.yml; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.terraform.outputs.check == 'true'
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Terraform fmt, validate and mock tests
        if: steps.terraform.outputs.check == 'true'
        working-directory: deploy/shared-instance/terraform
        env:
          TF_IN_AUTOMATION: '1'
          TF_INPUT: '0'
          CHECKPOINT_DISABLE: '1'
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Select content-only verification
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node projects/blog/apps/web/scripts/ci-scope.ts
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn install --immutable
        if: steps.scope.outputs.content-only != 'true'
      # DB와 앱 서버를 띄우지 않고 import 대상만 준비한다.
      - run: yarn workspace @side/toolkit build
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn workspace @photo-contest/api db:generate
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn workspace @game-feedback/api db:generate
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn workspace @photo-contest/web codegen
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn workspace @blog/web content:generate
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn workspace @side/config check
        if: steps.scope.outputs.content-only != 'true'
      - run: yarn typecheck:scripts
        if: steps.scope.outputs.content-only != 'true'
      - name: Reject new unused files, dependencies and exports
        if: steps.scope.outputs.content-only != 'true'
        run: yarn knip
