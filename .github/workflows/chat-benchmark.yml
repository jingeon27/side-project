name: Chat benchmark
on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Loopback delivery samples (1–20); this does not measure production capacity'
        type: number
        required: true
        default: 5
permissions:
  contents: read
concurrency:
  group: chat-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 25
    env:
      GF_S3_BUCKET: ${{ vars.GAME_FEEDBACK_S3_BUCKET }}
      GF_S3_REGION: ap-northeast-2
      GF_S3_KEY_PREFIX: ${{ vars.GAME_FEEDBACK_S3_KEY_PREFIX || 'game-feedback/ci' }}
      GF_S3_ACCESS_KEY_ID: ${{ secrets.GAME_FEEDBACK_S3_ACCESS_KEY_ID }}
      GF_S3_SECRET_ACCESS_KEY: ${{ secrets.GAME_FEEDBACK_S3_SECRET_ACCESS_KEY }}
      GF_CHAT_BENCHMARK_SAMPLES: ${{ inputs.samples }}
      GF_CHAT_BENCHMARK_INTERVAL_MS: '5000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - run: npm install --global @yarnpkg/cli-dist@4.17.0 --force
      - id: install
        run: yarn install --immutable
      - run: yarn workspace @side/game-feedback codegen
      - run: yarn workspace @side/game-feedback db:test:start
      - run: yarn workspace @game-feedback/web benchmark:chat
      - name: Keep only the sanitized measurement JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-delivery-${{ github.sha }}
          path: projects/game-feedback/apps/web/.e2e-build/chat-benchmark-results/**/chat-delivery.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop the owned test database
        if: always() && steps.install.outcome == 'success'
        run: yarn workspace @side/game-feedback db:test:stop
