name: Game Feedback

on:
  pull_request:
    paths:
      - 'projects/game-feedback/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/game-feedback.yml'
  push:
    branches: [main, develop]
    paths:
      - 'projects/game-feedback/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/game-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn workspace @side/game-feedback codegen
      - name: Check generated SDK
        run: git diff --exit-code -- projects/game-feedback/packages/sdk/src/generated
      - run: yarn workspace @side/design-system check
      - run: yarn check:game-feedback
      - run: yarn test:game-feedback
      - run: yarn build:game-feedback
      - run: yarn workspace @game-feedback/web exec playwright install --with-deps chromium webkit
      - run: yarn workspace @side/game-feedback test:e2e
      - name: Stop owned test database
        if: always()
        run: yarn workspace @side/game-feedback db:test:stop

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      GF_SMOKE_TAG: ${{ github.sha }}
      GF_SMOKE_IMAGE_PREFIX: ghcr.io/jingeon27/side-project-game-feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve public build settings
        env:
          SITE_URL: ${{ vars.GF_SITE_URL }}
          CONTACT_EMAIL: ${{ vars.GF_CONTACT_EMAIL }}
          DEPLOY_ENABLED: ${{ vars.GF_DEPLOY_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const site = process.env.SITE_URL || 'https://game-feedback.test';
          const url = new URL(site);
          if (url.origin !== site || url.protocol !== 'https:') throw new Error('GF_SITE_URL must be an HTTPS origin.');
          if (process.env.DEPLOY_ENABLED === 'true' && (!process.env.SITE_URL || !process.env.CONTACT_EMAIL))
            throw new Error('Configure GF_SITE_URL and GF_CONTACT_EMAIL before enabling deployment.');
          const email = process.env.CONTACT_EMAIL || 'operator@game-feedback.test';
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Invalid GF_CONTACT_EMAIL.');
          appendFileSync(process.env.GITHUB_ENV, `GF_BUILD_SITE_URL=${site}\nGF_BUILD_CONTACT_EMAIL=${email}\nGF_SMOKE_DOMAIN=${url.hostname}\n`);
          JS
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/game-feedback/deploy/lightsail/Dockerfile
          target: api
          platforms: linux/amd64
          load: true
          tags: ${{ env.GF_SMOKE_IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=game-feedback-api
          cache-to: type=gha,mode=max,scope=game-feedback-api
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/game-feedback/deploy/lightsail/Dockerfile
          target: web
          platforms: linux/amd64
          load: true
          tags: ${{ env.GF_SMOKE_IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            GF_SITE_URL=${{ env.GF_BUILD_SITE_URL }}
            GF_CONTACT_EMAIL=${{ env.GF_BUILD_CONTACT_EMAIL }}
          cache-from: type=gha,scope=game-feedback-web
          cache-to: type=gha,mode=max,scope=game-feedback-web
      - name: Verify the deployed stack and restore a backup into fresh volumes
        run: node projects/game-feedback/apps/api/scripts/production-smoke.mjs
      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GF_DEPLOY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GF_DEPLOY_ENABLED == 'true'
        run: |
          docker push "${GF_SMOKE_IMAGE_PREFIX}-api:${GF_SMOKE_TAG}"
          docker push "${GF_SMOKE_IMAGE_PREFIX}-web:${GF_SMOKE_TAG}"

  deploy:
    needs: [verify, containers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: game-feedback-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      GF_SSH_HOST: ${{ vars.GF_SSH_HOST }}
      GF_SSH_USER: ${{ vars.GF_SSH_USER || 'ubuntu' }}
      GF_SITE_URL: ${{ vars.GF_SITE_URL }}
      GF_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an obsolete main revision
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GF_RELEASE"
      - name: Prepare pinned SSH connection
        env:
          SSH_KEY: ${{ secrets.GF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GF_SSH_KNOWN_HOSTS }}
        run: |
          [[ "$GF_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$GF_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/game-feedback
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/game-feedback ~/.ssh/known_hosts
          ssh-keygen -F "$GF_SSH_HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Upload the release configuration
        run: |
          ssh -i ~/.ssh/game-feedback -o BatchMode=yes -o StrictHostKeyChecking=yes "$GF_SSH_USER@$GF_SSH_HOST" "install -d -m 700 /srv/game-feedback/releases/$GF_RELEASE"
          scp -i ~/.ssh/game-feedback -o BatchMode=yes -o StrictHostKeyChecking=yes projects/game-feedback/deploy/lightsail/{compose.yaml,Caddyfile,init-db.sh,ops.sh} "$GF_SSH_USER@$GF_SSH_HOST:/srv/game-feedback/releases/$GF_RELEASE/"
      - name: Deploy immutable images after backup and migrations
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/game-feedback -o BatchMode=yes -o StrictHostKeyChecking=yes "$GF_SSH_USER@$GF_SSH_HOST" "docker login ghcr.io --username '$REGISTRY_USER' --password-stdin"
          ssh -i ~/.ssh/game-feedback -o BatchMode=yes -o StrictHostKeyChecking=yes "$GF_SSH_USER@$GF_SSH_HOST" "bash /srv/game-feedback/releases/$GF_RELEASE/ops.sh deploy $GF_RELEASE"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$GF_SITE_URL/api/health"
      - name: Remove temporary credentials
        if: always()
        run: |
          if test -f ~/.ssh/game-feedback; then
            ssh -i ~/.ssh/game-feedback -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$GF_SSH_USER@$GF_SSH_HOST" 'docker logout ghcr.io' || true
          fi
          rm -f ~/.ssh/game-feedback ~/.ssh/known_hosts
