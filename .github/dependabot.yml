# Actions and base images stay pinned by digest/SHA; updates are reviewed and opened manually.
# Set every version-update PR limit to zero to stop automatic Dependabot PRs.
# Commit messages follow `<type>(deps): …` so the Commits check accepts them (PRs land with merge commits).
version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directories:
      - /projects/photo-contest/apps/api
      - /projects/photo-contest/apps/web
      - /projects/game-feedback/deploy/shared-instance
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        patterns: ['*']
    # 런타임 메이저는 .nvmrc(Node 24 LTS)와 함께 호환성을 검증한 뒤 직접 올린다.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    open-pull-requests-limit: 0
    directory: /deploy/shared-instance
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
