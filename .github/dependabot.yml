# Actions and base images are pinned by digest/SHA; Dependabot proposes the updates as reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /projects/photo-contest/apps/api
      - /projects/photo-contest/apps/web
      - /projects/game-feedback/deploy/shared-instance
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ['*']
    # 런타임 메이저는 .nvmrc(Node 24 LTS)와 함께 호환성을 검증한 뒤 직접 올린다.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /deploy/shared-instance
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
