[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "story-studio-engine"
version = "0.1.0"
description = "Local Korean generation and voice-training engine for Story Studio"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg==0.8.1",
    "Pillow==13.0.0",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
image = [
    "mlx-vlm==0.7.12",
    "mlx==0.32.4",
    "mflux==0.24.0",
    # The EmbeddingGemma 2 tokenizer was validated from this release on.
    "transformers>=5.18.0",
]
apple-silicon = [
    "story-studio-engine[image]",
    "mlx-audio==0.6.5",
    "lancedb==0.41.0",
    "mlx-video @ git+https://github.com/Blaizzy/mlx-video.git@87db56a51758fefb748a359b90a5283bb8ba4837",
    "torch==2.15.0",
]

[project.scripts]
story-studio-worker = "story_studio.worker:run_cli"
story-studio-setup = "story_studio.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_studio = ["models.json"]
