# SERVICE_ENV uses PC_*; legacy names remain readable until existing Secrets are replaced.
# Container variable names follow the API's existing configuration contract.
name: side-photo-contest
x-api: &api
  NODE_ENV: production
  PUSH_NOTIFICATIONS_ENABLED: ${PC_PUSH_NOTIFICATIONS_ENABLED-${PUSH_NOTIFICATIONS_ENABLED:-false}}
  EXPO_ACCESS_TOKEN: ${PC_EXPO_ACCESS_TOKEN-${EXPO_ACCESS_TOKEN:-}}
  API_URL: http://pc-api:4200
  WEB_ORIGIN: https://${PHOTO_CONTEST_DOMAIN:?Set PHOTO_CONTEST_DOMAIN}
  DATABASE_URL: ${PC_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL}}
  S3_BUCKET: ${PC_S3_BUCKET:-${S3_BUCKET:?Set S3_BUCKET}}
  S3_REGION: ${PC_S3_REGION-${S3_REGION:-ap-northeast-2}}
  S3_KEY_PREFIX: ${PC_S3_KEY_PREFIX-${S3_KEY_PREFIX:-photo-contest/production}}
  AWS_ACCESS_KEY_ID: ${PC_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${PC_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}}
  AWS_SESSION_TOKEN: ${PC_AWS_SESSION_TOKEN-${AWS_SESSION_TOKEN:-}}
  SENTRY_DSN: ${PC_SENTRY_DSN-${SENTRY_DSN:-}}
  NODE_OPTIONS: --max-old-space-size=384
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE digest}
    stop_grace_period: 20s
    restart: unless-stopped
    init: true
    environment: *api
    # The database alias shared-postgres resolves only on the service's internal db network; web never joins it.
    networks: { edge: { aliases: [pc-api] }, db: {} }
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4200/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
      start_interval: 1s
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE digest}
    stop_grace_period: 30s
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3200'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=384
      API_URL: http://pc-api:4200
      WEB_ORIGIN: https://${PHOTO_CONTEST_DOMAIN:?Set PHOTO_CONTEST_DOMAIN}
    networks: { edge: { aliases: [pc-web] } }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3200/health-check/live',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s
      start_interval: 1s
    # Next writes only its data/image cache and /tmp at runtime. ISR re-renders it cannot persist under
    # .next/server stay in the in-memory cache (Next logs "Failed to update prerender cache").
    read_only: true
    tmpfs:
      - '/tmp:size=64m,mode=1777'
      - '/app/projects/photo-contest/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700'
    mem_limit: 640m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  ops:
    profiles: [tools]
    image: ${API_IMAGE:?Set API_IMAGE digest}
    init: true
    entrypoint: [node]
    environment: *api
    networks: [edge, db]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  migrate:
    profiles: [tools]
    image: ${API_IMAGE:?Set API_IMAGE digest}
    init: true
    command: [node, scripts/production.ts, migrate]
    environment:
      <<: *api
      DATABASE_URL: ${PC_DATABASE_MIGRATION_URL:-${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL}}
    networks: [edge, db]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
networks:
  edge: { external: true, name: '${SIDE_NETWORK_PREFIX:-side}-photo-contest-edge' }
  db: { external: true, name: '${SIDE_NETWORK_PREFIX:-side}-photo-contest-db' }
