name: side-photo-contest
x-api: &api
  NODE_ENV: production
  DEPLOYMENT_TARGET: shared-instance
  API_HOST: 0.0.0.0
  PORT: '4200'
  TRUST_PROXY_HOPS: '1'
  WEB_ORIGIN: https://${PHOTO_CONTEST_DOMAIN:?Set PHOTO_CONTEST_DOMAIN}
  RDS_HOST: ${RDS_HOST:?Set RDS_HOST}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  ENABLE_DEV_LOGIN: 'false'
  ENABLE_TEST_API: 'false'
  STORAGE_BACKEND: s3
  S3_BUCKET: ${PHOTO_CONTEST_S3_BUCKET:?Set PHOTO_CONTEST_S3_BUCKET}
  OTHER_SERVICE_S3_BUCKET: ${GAME_FEEDBACK_S3_BUCKET:?Set GAME_FEEDBACK_S3_BUCKET}
  S3_REGION: ap-northeast-2
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${RELEASE_SHA:?Set RELEASE_SHA}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  NODE_OPTIONS: --max-old-space-size=384
x-ca: &ca
  - ${SIDE_DEPLOY_ROOT:-/srv/side-project}/certs/rds-ca.pem:/run/rds/ca.pem:ro
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE digest}
    stop_grace_period: 20s
    restart: unless-stopped
    init: true
    environment: *api
    volumes: *ca
    networks: { edge: { aliases: [pc-api] } }
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4200/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
      start_interval: 1s
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE digest}
    stop_grace_period: 30s
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3200'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=384
      API_URL: http://pc-api:4200
      WEB_ORIGIN: https://${PHOTO_CONTEST_DOMAIN:?Set PHOTO_CONTEST_DOMAIN}
    networks: { edge: { aliases: [pc-web] } }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3200/_health/live',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s
      start_interval: 1s
    tmpfs: ['/app/projects/photo-contest/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700']
    mem_limit: 640m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  ops:
    profiles: [tools]
    image: ${API_IMAGE:?Set API_IMAGE digest}
    init: true
    entrypoint: [node]
    environment: *api
    volumes: *ca
    networks: [edge]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 256m
    logging: *logging
  migrate:
    profiles: [tools]
    image: ${API_IMAGE:?Set API_IMAGE digest}
    init: true
    command: [node, scripts/production.mjs, migrate]
    environment:
      <<: *api
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL}
    volumes: *ca
    networks: [edge]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 256m
    logging: *logging
networks:
  edge: { external: true, name: '${SIDE_NETWORK_PREFIX:-side}-photo-contest-edge' }
