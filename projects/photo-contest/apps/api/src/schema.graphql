scalar DateTime

type User {
  id: ID!
  nickname: String!
  avatar: String
}
type Member {
  user: User!
  role: String!
}
enum Phase {
  UPCOMING
  SUBMISSION
  VOTING
  COMPLETED
}
type Group {
  id: ID!
  name: String!
  role: String!
  inviteToken: String
  members: [Member!]!
  contests: [Contest!]!
}
type Contest {
  id: ID!
  groupId: ID!
  title: String!
  startsAt: DateTime!
  submissionEndsAt: DateTime!
  endsAt: DateTime!
  phase: Phase!
  isAdmin: Boolean!
  mySubmissionId: ID
  myVoteId: ID
  submissions: [Submission!]!
}
type Submission {
  id: ID!
  author: User!
  caption: String!
  imageUrl: String!
  hidden: Boolean!
  createdAt: DateTime!
  voteCount: Int
  reportCount: Int
  reports: [Report!]
}
type Report {
  id: ID!
  reason: String!
  createdAt: DateTime!
}
type Result {
  submission: Submission!
  voteCount: Int!
  winner: Boolean!
}
type UploadTicket {
  id: ID!
  url: String!
  expiresAt: DateTime!
}
type Vote {
  id: ID!
  contestId: ID!
  submissionId: ID!
}
type Query {
  me: User
  myGroups: [Group!]!
  group(id: ID!): Group!
  contest(id: ID!): Contest!
  submissions(contestId: ID!, offset: Int = 0, limit: Int = 24): [Submission!]!
  contestResults(contestId: ID!): [Result!]!
}
type Mutation {
  createGroup(name: String!): Group!
  joinGroup(token: String!): Group!
  createContest(
    groupId: ID!
    title: String!
    startsAt: DateTime!
    submissionEndsAt: DateTime!
    endsAt: DateTime!
  ): Contest!
  requestUploadUrl(contestId: ID!): UploadTicket!
  createSubmission(contestId: ID!, uploadId: ID!, caption: String!, rightsConfirmed: Boolean!): Submission!
  castVote(contestId: ID!, submissionId: ID!): Vote!
  reportSubmission(submissionId: ID!, reason: String!): Boolean!
  hideSubmission(submissionId: ID!): Boolean!
  deleteSubmission(submissionId: ID!): Boolean!
}
