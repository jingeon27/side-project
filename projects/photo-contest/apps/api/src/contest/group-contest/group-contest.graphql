enum GroupContestFilter {
  ACTIVE
  OPEN
  COMPLETED
}

type GroupContest {
  id: ID!
  groupId: ID!
  title: String!
  likeLimit: Int!
  startsAt: DateTime!
  submissionEndsAt: DateTime!
  endsAt: DateTime!
  phase: Phase!
  isAdmin: Boolean!
  canParticipate: Boolean!
  canVote: Boolean!
  votedPostId: ID
  entryCount: Int!
  winners: [GroupContestResult!]!
  "화면이 마지막으로 바뀐 시각. 생성, 지나간 단계 경계, 마지막 참여작 중 가장 늦은 값이다"
  lastModifiedAt: DateTime!
}

type GroupContestResult {
  rank: Int!
  post: GalleryPost!
  voteCount: Int!
  winner: Boolean!
}

extend type Query {
  publicGroupContestCount: Int!
  publicGroupContests(offset: Int = 0, limit: Int = 24): [GroupContest!]!
  groupContests(
    groupId: ID!
    filter: GroupContestFilter = ACTIVE
    offset: Int = 0
    limit: Int = 24
  ): [GroupContest!]!
  groupContest(id: ID!): GroupContest!
  groupContestResults(contestId: ID!): [GroupContestResult!]!
}

extend type Mutation {
  createGroupContest(
    groupId: ID!
    title: String!
    likeLimit: Int = 1
    startsAt: DateTime!
    submissionEndsAt: DateTime!
    endsAt: DateTime!
  ): GroupContest!
  castGroupContestVote(contestId: ID!, postId: ID!): GroupContest!
}
