enum PostKind {
  PHOTO
  VIDEO
  LINK
}
enum PostSort {
  NEWEST
  MONTHLY_POPULAR
}
type PostContest {
  id: ID!
  groupId: ID!
  title: String!
  likeLimit: Int!
  phase: Phase!
}
type GalleryPost {
  category: GroupCategory
  contestId: ID
  contest: PostContest
  id: ID!
  groupId: ID!
  groupName: String!
  title: String!
  body: String!
  author: User!
  createdAt: DateTime!
  kind: PostKind!
  mediaUrl: String
  "올릴 때 브라우저가 잰 가로·세로. 화면 틀의 비율에만 쓰며, 모르면 둘 다 null"
  mediaWidth: Int
  mediaHeight: Int
  linkUrl: String
  likeCount: Int!
  commentCount: Int!
  likedByMe: Boolean!
  canDelete: Boolean!
  canModerate: Boolean!
  canInteract: Boolean!
}
type PostComment {
  id: ID!
  postId: ID!
  parentId: ID
  replyCount: Int!
  body: String!
  author: User!
  createdAt: DateTime!
  canDelete: Boolean!
  likeCount: Int!
  likedByMe: Boolean!
  canInteract: Boolean!
}
type PostDownload {
  url: String!
  filename: String!
  expiresAt: DateTime
}
type HiddenGalleryPost {
  id: ID!
  title: String!
  createdAt: DateTime!
}
type GalleryPostPage {
  items: [GalleryPost!]!
  nextOffset: Int
}

type HiddenGalleryPostPage {
  items: [HiddenGalleryPost!]!
  nextOffset: Int
}

extend type Query {
  galleryPost(id: ID!): GalleryPost!
  hiddenGalleryPosts(groupId: ID!, offset: Int = 0, limit: Int = 24): [HiddenGalleryPost!]!
  hiddenGalleryPostsPage(groupId: ID!, offset: Int = 0, limit: Int = 24): HiddenGalleryPostPage!
  publicGalleryPosts(sort: PostSort!, offset: Int = 0, limit: Int = 24): [GalleryPost!]!
  publicGalleryPostsPage(sort: PostSort!, offset: Int = 0, limit: Int = 24): GalleryPostPage!
  myGalleryPosts(groupId: ID, offset: Int = 0, limit: Int = 24): [GalleryPost!]!
  myGalleryPostsPage(groupId: ID, offset: Int = 0, limit: Int = 24): GalleryPostPage!
  postDownload(postId: ID!): PostDownload!
  galleryPosts(
    categoryId: ID
    groupId: ID
    contestId: ID
    sort: PostSort = NEWEST
    offset: Int = 0
    limit: Int = 24
  ): [GalleryPost!]!
  galleryPostsPage(
    categoryId: ID
    groupId: ID
    contestId: ID
    sort: PostSort = NEWEST
    offset: Int = 0
    limit: Int = 24
  ): GalleryPostPage!
  postComments(postId: ID!, parentId: ID, offset: Int = 0, limit: Int = 24): [PostComment!]!
  postCommentCount(postId: ID!, parentId: ID): Int!
}
extend type Mutation {
  setPostCategory(postId: ID!, categoryId: ID): GalleryPost!
  setPostHidden(postId: ID!, hidden: Boolean!): Boolean!
  "width·height는 함께 보내거나 함께 비운다. 1~20000 정수"
  requestPostUpload(
    groupId: ID!
    contentType: String!
    byteSize: Int!
    width: Int
    height: Int
  ): PostUploadTicket!
  completePostUpload(uploadId: ID!): PostUploadResult!
  createPost(
    clientRequestId: String
    categoryId: ID
    contestId: ID
    groupId: ID!
    uploadId: ID
    linkUrl: String
    title: String!
    body: String
    rightsConfirmed: Boolean!
  ): GalleryPost!
  likePost(postId: ID!): GalleryPost!
  unlikePost(postId: ID!): GalleryPost!
  deletePost(postId: ID!): Boolean!
  updatePost(postId: ID!, title: String!, body: String, categoryId: ID): GalleryPost!
  createPostComment(postId: ID!, parentId: ID, body: String!): PostComment!
  deletePostComment(commentId: ID!): Boolean!
  likePostComment(commentId: ID!): PostComment!
  unlikePostComment(commentId: ID!): PostComment!
}

type UploadFormField {
  name: String!
  value: String!
}
type PostUploadTicket {
  id: ID!
  url: String!
  fields: [UploadFormField!]!
  expiresAt: DateTime!
}
type PostUploadResult {
  id: ID!
  kind: PostKind!
  contentType: String!
  byteSize: Int!
}
