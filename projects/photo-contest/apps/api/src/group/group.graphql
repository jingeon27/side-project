enum GroupRole {
  OWNER
  MODERATOR
  MEMBER
}
enum GroupVisibility {
  PUBLIC
  PRIVATE
}

type Member {
  user: User!
  role: GroupRole!
}

"종료된 대회만 집계한다. 우승 횟수와 받은 표가 같으면 같은 순위"
type LeaderboardEntry {
  rank: Int!
  user: User!
  wins: Int!
  votesReceived: Int!
  likesReceived: Int!
  submissions: Int!
}

type Group {
  id: ID!
  name: String!
  description: String!
  avatarUrl: String
  "조회한 사용자의 역할"
  role: GroupRole
  visibility: GroupVisibility!
  memberCount: Int!
  canViewPosts: Boolean!
  joinRequestPending: Boolean!
  "그룹 멤버 누구나 공유할 수 있는 초대 토큰"
  inviteToken: String
  members: [Member!]!
  "최근 대회 50개, 최신순"
  contests: [Contest!]!
  leaderboard: [LeaderboardEntry!]!
}

type GroupJoinRequest {
  id: ID!
  groupId: ID!
  user: User!
  createdAt: DateTime!
}

type InvitePreview {
  groupName: String!
  memberCount: Int!
  ownerNickname: String!
  "로그인한 사용자가 이미 멤버이면 그룹 ID, 아니면 null"
  joinedGroupId: ID
  visibility: GroupVisibility!
  joinRequestPending: Boolean!
}

type Query {
  myGroups: [Group!]!
  group(id: ID!): Group!
  "공개·비공개 그룹의 이름을 탐색한다. 비공개 게시물·초대 토큰·멤버 명단은 노출하지 않는다"
  discoverGroups(search: String, visibility: GroupVisibility, offset: Int = 0, limit: Int = 24): [Group!]!
  publicGroupCount: Int!
  "그룹장만 가입 신청을 조회한다"
  groupJoinRequests(groupId: ID!, offset: Int = 0, limit: Int = 24): [GroupJoinRequest!]!
  "로그인하지 않아도 초대 토큰으로 그룹을 미리 본다"
  invitePreview(token: String!): InvitePreview!
}

type Mutation {
  setGroupModerator(groupId: ID!, userId: ID!, enabled: Boolean!): Group!
  transferGroupOwnership(groupId: ID!, userId: ID!): Group!
  createGroup(name: String!, visibility: GroupVisibility! = PUBLIC, description: String = ""): Group!
  updateGroupProfile(
    groupId: ID!
    name: String!
    description: String!
    avatarId: ID
    removeAvatar: Boolean! = false
  ): Group!
  "공개 그룹은 즉시 가입하고 비공개 그룹은 승인 대기 신청을 만든다"
  requestGroupMembership(groupId: ID!): Group!
  approveGroupJoinRequest(requestId: ID!): Boolean!
  rejectGroupJoinRequest(requestId: ID!): Boolean!
  joinGroup(token: String!): Group!
  "관리자만. 이전 초대 링크는 더 이상 쓸 수 없다"
  regenerateInviteLink(groupId: ID!): Group!
}

type GroupAvatarTicket {
  id: ID!
}
extend type Mutation {
  requestGroupAvatarUpload(groupId: ID!, contentType: String!, byteSize: Int!): UploadTicket!
  completeGroupAvatarUpload(uploadId: ID!): GroupAvatarTicket!
}
