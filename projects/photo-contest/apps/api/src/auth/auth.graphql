type User {
  id: ID!
  nickname: String!
  avatar: String
  needsOnboarding: Boolean!
}

type Query {
  "로그인한 사용자. 로그인하지 않았으면 null"
  me: User
}

extend type Mutation {
  registerWithPassword(loginId: String!, password: String!, nickname: String!): User!
  loginWithPassword(loginId: String!, password: String!): User!
}
