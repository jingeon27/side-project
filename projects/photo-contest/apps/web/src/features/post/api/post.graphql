fragment GalleryPostCard on GalleryPost {
  id
  contestId
  contest {
    id
    groupId
    title
    phase
  }
  groupId
  groupName
  title
  body
  kind
  mediaUrl
  linkUrl
  createdAt
  likeCount
  commentCount
  likedByMe
  canDelete
  canModerate
  canInteract
  author {
    id
    nickname
    avatar
  }
}
query GalleryPosts($groupId: ID, $contestId: ID, $sort: PostSort!, $offset: Int!, $limit: Int!) {
  galleryPosts(groupId: $groupId, contestId: $contestId, sort: $sort, offset: $offset, limit: $limit) {
    ...GalleryPostCard
  }
}
mutation RequestPostUpload($groupId: ID!) {
  requestPostUpload(groupId: $groupId) {
    id
    url
  }
}
mutation CreatePost(
  $contestId: ID
  $groupId: ID!
  $uploadId: ID
  $linkUrl: String
  $title: String!
  $body: String
  $rightsConfirmed: Boolean!
) {
  createPost(
    contestId: $contestId
    groupId: $groupId
    uploadId: $uploadId
    linkUrl: $linkUrl
    title: $title
    body: $body
    rightsConfirmed: $rightsConfirmed
  ) {
    ...GalleryPostCard
  }
}
mutation LikePost($postId: ID!) {
  likePost(postId: $postId) {
    ...GalleryPostCard
  }
}
mutation UnlikePost($postId: ID!) {
  unlikePost(postId: $postId) {
    ...GalleryPostCard
  }
}
mutation DeletePost($postId: ID!) {
  deletePost(postId: $postId)
}

mutation UploadPostMedia($uploadId: ID!, $file: Upload!) {
  uploadPostMedia(uploadId: $uploadId, file: $file)
}

query PostDownload($postId: ID!) {
  postDownload(postId: $postId) {
    url
    filename
    expiresAt
  }
}

fragment PostCommentCard on PostComment {
  id
  postId
  body
  createdAt
  canDelete
  author {
    id
    nickname
    avatar
  }
}
query PostComments($postId: ID!, $offset: Int!, $limit: Int!) {
  postComments(postId: $postId, offset: $offset, limit: $limit) {
    ...PostCommentCard
  }
}
mutation CreatePostComment($postId: ID!, $body: String!) {
  createPostComment(postId: $postId, body: $body) {
    ...PostCommentCard
  }
}
mutation DeletePostComment($commentId: ID!) {
  deletePostComment(commentId: $commentId)
}

query PublicGalleryPosts($sort: PostSort!, $offset: Int!, $limit: Int!) {
  publicGalleryPosts(sort: $sort, offset: $offset, limit: $limit) {
    ...GalleryPostCard
  }
}

query RefreshPost($id: ID!) {
  galleryPost(id: $id) {
    ...GalleryPostCard
  }
}
query HiddenGalleryPosts($groupId: ID!, $offset: Int!, $limit: Int!) {
  hiddenGalleryPosts(groupId: $groupId, offset: $offset, limit: $limit) {
    id
    title
    createdAt
  }
}
mutation SetPostHidden($postId: ID!, $hidden: Boolean!) {
  setPostHidden(postId: $postId, hidden: $hidden)
}
