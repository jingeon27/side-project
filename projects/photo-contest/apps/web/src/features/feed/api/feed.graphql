query MyPhotoFeed($offset: Int!, $limit: Int!) {
  myPhotoFeed(offset: $offset, limit: $limit) {
    id
    groupId
    groupName
    contestTitle
    phase
    submission {
      id
      contestId
      caption
      imageUrl
      hidden
      createdAt
      likeCount
      likedByMe
      author {
        id
        nickname
        avatar
      }
    }
  }
}
