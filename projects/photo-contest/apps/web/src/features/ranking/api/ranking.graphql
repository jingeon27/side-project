# 종료된 대회만. 득표순, 같은 표는 같은 순위(1, 1, 3)
query ContestResults($contestId: ID!) {
  contestResults(contestId: $contestId) {
    rank
    voteCount
    winner
    submission {
      ...SubmissionCard
    }
  }
}

# 그룹 순위(명예의 전당)는 요청할 때만 계산되므로 그룹 화면과 따로 불러온다.
query GroupLeaderboard($groupId: ID!) {
  group(id: $groupId) {
    id
    leaderboard {
      rank
      wins
      votesReceived
      likesReceived
      submissions
      user {
        id
        nickname
        avatar
      }
    }
  }
}
