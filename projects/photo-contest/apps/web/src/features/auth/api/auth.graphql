query Me {
  me {
    needsOnboarding
    isAnonymous
    id
    nickname
    avatar
  }
}

mutation StartAnonymousSession {
  startAnonymousSession {
    id
    nickname
    avatar
    isAnonymous
    needsOnboarding
  }
}

mutation RegisterWithPassword($loginId: String!, $password: String!, $nickname: String!) {
  registerWithPassword(loginId: $loginId, password: $password, nickname: $nickname) {
    id
    nickname
    avatar
  }
}
mutation LoginWithPassword($loginId: String!, $password: String!) {
  loginWithPassword(loginId: $loginId, password: $password) {
    id
    nickname
    avatar
  }
}
