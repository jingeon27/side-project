fragment Photo on Submission {
  id
  author {
    id
    nickname
  }
  caption
  imageUrl
  hidden
  createdAt
  voteCount
  reportCount
  reports {
    id
    reason
    createdAt
  }
}
query Contest($id: ID!) {
  contest(id: $id) {
    id
    groupId
    title
    phase
    startsAt
    submissionEndsAt
    endsAt
    isAdmin
    mySubmissionId
    myVoteId
    submissions {
      ...Photo
    }
  }
}
query MorePhotos($contestId: ID!, $offset: Int!, $limit: Int!) {
  submissions(contestId: $contestId, offset: $offset, limit: $limit) {
    ...Photo
  }
}
query Results($contestId: ID!) {
  contestResults(contestId: $contestId) {
    submission {
      ...Photo
    }
    voteCount
    winner
  }
}
mutation RequestUpload($contestId: ID!) {
  requestUploadUrl(contestId: $contestId) {
    id
    url
    expiresAt
  }
}
mutation CreateSubmission($contestId: ID!, $uploadId: ID!, $caption: String!, $rightsConfirmed: Boolean!) {
  createSubmission(
    contestId: $contestId
    uploadId: $uploadId
    caption: $caption
    rightsConfirmed: $rightsConfirmed
  ) {
    ...Photo
  }
}
mutation CastVote($contestId: ID!, $submissionId: ID!) {
  castVote(contestId: $contestId, submissionId: $submissionId) {
    id
    contestId
    submissionId
  }
}
mutation ReportPhoto($submissionId: ID!, $reason: String!) {
  reportSubmission(submissionId: $submissionId, reason: $reason)
}
mutation HidePhoto($submissionId: ID!) {
  hideSubmission(submissionId: $submissionId)
}
mutation DeletePhoto($submissionId: ID!) {
  deleteSubmission(submissionId: $submissionId)
}
