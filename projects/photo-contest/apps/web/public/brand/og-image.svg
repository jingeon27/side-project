<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>피식 | 혼자 보기 아까운 순간</title>
<desc>어두운 배경에 피식 로고와 소개 문구를 두고, 노을과 바다, 밤거리 불빛 사진을 피드처럼 엇갈려 배치했습니다.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset=".48" stop-color="#ff9b42"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
  <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(890 380) scale(520 400)"><stop offset="0" stop-color="#ff9b42" stop-opacity=".3"/><stop offset="1" stop-color="#ff9b42" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 -20) scale(460 360)"><stop offset="0" stop-color="#ff5f8f" stop-opacity=".22"/><stop offset="1" stop-color="#ff5f8f" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#ffb259"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8a0"/><stop offset="1" stop-color="#ff8a62"/></linearGradient>
  <linearGradient id="duskSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8607a"/><stop offset="1" stop-color="#2f1d3d"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb6ff"/><stop offset="1" stop-color="#d8eeff"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c6fb8"/><stop offset="1" stop-color="#58b3e6"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dcbd"/><stop offset="1" stop-color="#e2bf96"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17142b"/><stop offset="1" stop-color="#3b1c3c"/></linearGradient>
  <radialGradient id="peach1" cx=".25" cy=".3" r=".8"><stop offset="0" stop-color="#ffe6c9"/><stop offset="1" stop-color="#ffe6c9" stop-opacity="0"/></radialGradient>
  <radialGradient id="peach2" cx=".8" cy=".8" r=".7"><stop offset="0" stop-color="#ff8a9a"/><stop offset="1" stop-color="#ff8a9a" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur18" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
  <clipPath id="cA"><rect x="620" y="-30" width="260" height="300" rx="26"/></clipPath>
  <clipPath id="cB"><rect x="620" y="290" width="260" height="370" rx="26"/></clipPath>
  <clipPath id="cC"><rect x="900" y="60" width="260" height="400" rx="26"/></clipPath>
  <clipPath id="cD"><rect x="900" y="480" width="260" height="220" rx="26"/></clipPath>
</defs>
<style>text{font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif}</style>
<rect width="1200" height="630" fill="#0d0c0b"/>
<rect width="1200" height="630" fill="url(#glowA)"/>
<rect width="1200" height="630" fill="url(#glowB)"/>

<g filter="url(#shadow)">
  <g clip-path="url(#cA)"><rect x="620" y="-30" width="260" height="300" fill="url(#dusk)"/>
    <circle cx="750" cy="170" r="90" fill="#ffe2a8" opacity=".55" filter="url(#blur18)"/><circle cx="750" cy="172" r="38" fill="#fff3d2" filter="url(#soft)"/>
    <rect x="620" y="172" width="260" height="100" fill="url(#duskSea)"/>
    <g filter="url(#blur6)" fill="#ffd9a0"><ellipse cx="750" cy="200" rx="34" ry="10" opacity=".8"/><ellipse cx="750" cy="226" rx="24" ry="6" opacity=".55"/><ellipse cx="750" cy="248" rx="16" ry="4" opacity=".4"/></g></g>
  <g clip-path="url(#cB)"><g filter="url(#soft)"><rect x="620" y="290" width="260" height="190" fill="url(#sky)"/><rect x="620" y="478" width="260" height="70" fill="url(#sea)"/><path d="M620 548q65-12 130 0t130-2v114H620Z" fill="url(#sand)"/><path d="M620 548q65-12 130 0t130-2" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/></g>
    <g filter="url(#blur6)" fill="#fff"><ellipse cx="690" cy="356" rx="58" ry="14" opacity=".75"/><ellipse cx="820" cy="400" rx="44" ry="10" opacity=".55"/></g>
    <circle cx="750" cy="432" r="32" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><path d="M742 418.5v27l21-13.5Z" fill="#fff"/></g>
  <g clip-path="url(#cC)"><rect x="900" y="60" width="260" height="400" fill="url(#night)"/>
    <g filter="url(#blur18)"><circle cx="1010" cy="220" r="60" fill="#ffb259" opacity=".3"/></g>
    <g filter="url(#blur6)"><circle cx="950" cy="140" r="30" fill="#ff9b42" opacity=".85"/><circle cx="1080" cy="120" r="22" fill="#ffd166" opacity=".8"/><circle cx="1120" cy="230" r="38" fill="#ff5f8f" opacity=".7"/><circle cx="990" cy="260" r="20" fill="#7cc4ff" opacity=".8"/><circle cx="1040" cy="330" r="44" fill="#ffb259" opacity=".55"/><circle cx="930" cy="360" r="26" fill="#ff5f8f" opacity=".6"/><circle cx="1130" cy="380" r="18" fill="#ffd166" opacity=".8"/></g>
    <rect x="916" y="400" width="112" height="44" rx="22" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".35"/>
    <path d="M944 414c-3.6-3.6-9.6.4-7 5.4L944 427l7-7.2c2.6-5-3.4-9-7-5.4Z" fill="#fff"/>
    <text x="960" y="430" font-size="20" font-weight="700" fill="#fff">128</text></g>
  <g clip-path="url(#cD)"><rect x="900" y="480" width="260" height="220" fill="#ffb98f"/><rect x="900" y="480" width="260" height="220" fill="url(#peach1)"/><rect x="900" y="480" width="260" height="220" fill="url(#peach2)"/></g>
</g>

<g transform="translate(72 60)"><rect width="60" height="60" rx="21" fill="url(#brand)"/><g transform="scale(.9375)" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 25 5-3 5 3M38 25l5-3 5 3"/><path d="M20 37c7 10 20 10 27-2"/></g></g>
<text x="148" y="104" font-size="40" font-weight="800" fill="#fff" letter-spacing="-1">피식</text>
<text x="70" y="338" font-size="80" font-weight="800" fill="#fff" letter-spacing="-3">혼자 보기</text>
<text x="70" y="430" font-size="80" font-weight="800" fill="#fff" letter-spacing="-3">아까운 <tspan fill="url(#accent)">순간.</tspan></text>
<text x="74" y="500" font-size="26" font-weight="500" fill="#9b958e" letter-spacing="-.5">사진과 동영상을 모으는 그룹 커뮤니티</text>
</svg>
