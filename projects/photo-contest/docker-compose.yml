services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: contest
      POSTGRES_PASSWORD: contest
      POSTGRES_DB: photo_contest
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - contest-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contest -d photo_contest']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  contest-postgres:
