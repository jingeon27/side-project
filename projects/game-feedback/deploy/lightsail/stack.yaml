AWSTemplateFormatVersion: '2010-09-09'
Description: Game Feedback single-server production stack in Seoul (application deployment is separate).

Parameters:
  InstanceName:
    Type: String
    Default: game-feedback-production
    AllowedPattern: '[a-z][a-z0-9-]{2,50}'
  KeyPairName:
    Type: String
    Description: Existing Lightsail SSH key pair in ap-northeast-2.
  BlueprintId:
    Type: String
    Description: Active Ubuntu 24.04 LTS blueprint ID from Lightsail get-blueprints.
  BundleId:
    Type: String
    Default: small_3_0
    AllowedValues: [small_3_0, medium_3_0]
  SshAllowedCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0
    Description: SSH source networks. GitHub-hosted CD runners must be able to connect.
  EnableSnapshots:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional billed Lightsail auto snapshots, in addition to operator backups.
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional recipient for monthly Lightsail cost alerts (not an automatic spending cap).

Conditions:
  Snapshots: { Fn::Equals: [{ Ref: EnableSnapshots }, 'true'] }
  BudgetAlerts: { Fn::Not: [{ Fn::Equals: [{ Ref: BudgetEmail }, ''] }] }

Resources:
  Instance:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceName: { Ref: InstanceName }
      AvailabilityZone: ap-northeast-2a
      BlueprintId: { Ref: BlueprintId }
      BundleId: { Ref: BundleId }
      KeyPairName: { Ref: KeyPairName }
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs: { Ref: SshAllowedCidrs }
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
            Cidrs: [0.0.0.0/0]
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            Cidrs: [0.0.0.0/0]
      AddOns:
        - AddOnType: AutoSnapshot
          Status: { Fn::If: [Snapshots, Enabled, Disabled] }
          AutoSnapshotAddOnRequest:
            SnapshotTimeOfDay: '18:00'
      Tags:
        - Key: project
          Value: game-feedback
      UserData: |
        #!/usr/bin/env bash
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y docker.io docker-compose-v2 python3 curl openssl ca-certificates
        systemctl enable --now docker
        usermod -aG docker ubuntu
        install -d -m 0700 -o ubuntu -g ubuntu /srv/game-feedback
        if ! test -f /swapfile; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
        cat > /etc/systemd/system/game-feedback-backup.service <<'UNIT'
        [Unit]
        Description=Game Feedback database and private media backup
        Requires=docker.service
        After=docker.service
        ConditionPathExists=/srv/game-feedback/current/ops.sh
        [Service]
        Type=oneshot
        User=ubuntu
        SupplementaryGroups=docker
        WorkingDirectory=/srv/game-feedback
        ExecStart=/usr/bin/bash /srv/game-feedback/current/ops.sh backup
        ExecStartPost=/usr/bin/bash /srv/game-feedback/current/ops.sh prune
        Nice=10
        UNIT
        cat > /etc/systemd/system/game-feedback-backup.timer <<'UNIT'
        [Unit]
        Description=Daily Game Feedback backup at approximately 03:00 Asia/Seoul
        [Timer]
        OnCalendar=*-*-* 18:00:00 UTC
        RandomizedDelaySec=15m
        Persistent=true
        [Install]
        WantedBy=timers.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now game-feedback-backup.timer

  PublicIp:
    Type: AWS::Lightsail::StaticIp
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StaticIpName: { Fn::Sub: '${InstanceName}-ipv4' }
      AttachedTo: { Ref: Instance }

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetAlerts
    Properties:
      Budget:
        BudgetName: { Fn::Sub: '${InstanceName}-monthly' }
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 20, Unit: USD }
        CostFilters:
          Service: [Amazon Lightsail]
      NotificationsWithSubscribers:
        - Notification:
            {
              NotificationType: ACTUAL,
              ComparisonOperator: GREATER_THAN,
              Threshold: 80,
              ThresholdType: PERCENTAGE,
            }
          Subscribers: [{ SubscriptionType: EMAIL, Address: { Ref: BudgetEmail } }]
        - Notification:
            {
              NotificationType: FORECASTED,
              ComparisonOperator: GREATER_THAN,
              Threshold: 100,
              ThresholdType: PERCENTAGE,
            }
          Subscribers: [{ SubscriptionType: EMAIL, Address: { Ref: BudgetEmail } }]

Outputs:
  PublicIp:
    Value: { Fn::GetAtt: [PublicIp, IpAddress] }
  SshUser:
    Value: ubuntu
