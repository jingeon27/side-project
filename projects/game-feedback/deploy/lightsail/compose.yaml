name: game-feedback

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '4300'
  WEB_ORIGIN: https://${GF_DOMAIN:?Set GF_DOMAIN}
  # 앱 소셜 로그인 코드는 웹 origin의 검증된 https 앱 링크로만 보낸다.
  MOBILE_AUTH_CALLBACK_URL: https://${GF_DOMAIN:?Set GF_DOMAIN}/app-auth/callback
  GAME_FEEDBACK_SITE_URL: https://${GF_DOMAIN:?Set GF_DOMAIN}
  GAME_FEEDBACK_CONTACT_EMAIL: ${GF_CONTACT_EMAIL:?Set GF_CONTACT_EMAIL}
  DATABASE_URL: postgresql://game_feedback:${GF_DB_PASSWORD:?Set GF_DB_PASSWORD}@db:5432/game_feedback?schema=public&connection_limit=5&pool_timeout=15
  GF_DEMO_MODE: 'false'
  GF_TEST_AUTH_ENABLED: 'false'
  GF_PREFETCH_TESTING: 'false'
  GF_CACHE_REVALIDATION_SECRET: ${GF_CACHE_REVALIDATION_SECRET:?Set GF_CACHE_REVALIDATION_SECRET}
  GF_CACHE_REVALIDATION_URL: http://web:3300/internal/cache/revalidate
  GF_MEDIA_STORAGE: ${GF_MEDIA_STORAGE:-FILESYSTEM}
  GF_MEDIA_DIRECTORY: /var/lib/game-feedback/media
  GF_S3_BUCKET: ${GF_S3_BUCKET:-}
  GF_S3_REGION: ${GF_S3_REGION:-auto}
  GF_S3_ENDPOINT: ${GF_S3_ENDPOINT:-}
  GF_S3_ACCESS_KEY_ID: ${GF_S3_ACCESS_KEY_ID:-}
  GF_S3_SECRET_ACCESS_KEY: ${GF_S3_SECRET_ACCESS_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  X_CLIENT_ID: ${X_CLIENT_ID:-}
  X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  SUPERCELL_API_TOKEN: ${SUPERCELL_API_TOKEN:-}
  GF_ADMIN_GOOGLE_SUB: ${GF_ADMIN_GOOGLE_SUB:-}
  NODE_OPTIONS: --max-old-space-size=256

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${GF_DB_ADMIN_PASSWORD:?Set GF_DB_ADMIN_PASSWORD}
      GF_DB_PASSWORD: ${GF_DB_PASSWORD:?Set GF_DB_PASSWORD}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=4MB]
    volumes:
      - database:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-game-feedback.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d game_feedback']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    shm_size: 128m
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  api:
    image: ${GF_IMAGE_PREFIX:?Set GF_IMAGE_PREFIX}-api:${GF_IMAGE_TAG:?Set GF_IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment: *api-environment
    ports: ['127.0.0.1:${GF_API_BIND_PORT:-4300}:4300']
    volumes: [media:/var/lib/game-feedback/media]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    image: ${GF_IMAGE_PREFIX:?Set GF_IMAGE_PREFIX}-web:${GF_IMAGE_TAG:?Set GF_IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3300'
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=384
      GAME_FEEDBACK_API_URL: http://api:4300
      GF_CACHE_REVALIDATION_SECRET: ${GF_CACHE_REVALIDATION_SECRET:?Set GF_CACHE_REVALIDATION_SECRET}
      WEB_ORIGIN: https://${GF_DOMAIN:?Set GF_DOMAIN}
      GAME_FEEDBACK_SITE_URL: https://${GF_DOMAIN:?Set GF_DOMAIN}
      GAME_FEEDBACK_CONTACT_EMAIL: ${GF_CONTACT_EMAIL:?Set GF_CONTACT_EMAIL}
      GAME_FEEDBACK_INDEXING: ${GF_INDEXING:-false}
      GF_DEMO_MODE: 'false'
      GF_TEST_AUTH_ENABLED: 'false'
      # /.well-known/apple-app-site-association·assetlinks.json. 없으면 웹이 첫 요청부터 실패한다.
      MOBILE_APPLE_TEAM_ID: ${MOBILE_APPLE_TEAM_ID:?Set MOBILE_APPLE_TEAM_ID}
      MOBILE_IOS_BUNDLE_ID: ${MOBILE_IOS_BUNDLE_ID:?Set MOBILE_IOS_BUNDLE_ID}
      MOBILE_ANDROID_PACKAGE: ${MOBILE_ANDROID_PACKAGE:?Set MOBILE_ANDROID_PACKAGE}
      MOBILE_ANDROID_SHA256_FINGERPRINTS: ${MOBILE_ANDROID_SHA256_FINGERPRINTS:?Set MOBILE_ANDROID_SHA256_FINGERPRINTS}
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3300/ko').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 640m
    tmpfs: ['/app/projects/game-feedback/apps/web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GF_DOMAIN: ${GF_DOMAIN:?Set GF_DOMAIN}
      GF_TLS_EMAIL: ${GF_CONTACT_EMAIL:?Set GF_CONTACT_EMAIL}
    ports:
      [
        '${GF_BIND_ADDRESS:-0.0.0.0}:${GF_HTTP_BIND_PORT:-80}:80',
        '${GF_BIND_ADDRESS:-0.0.0.0}:${GF_HTTPS_BIND_PORT:-443}:443',
      ]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on: { web: { condition: service_healthy } }
    mem_limit: 96m
    logging: *logging

  ops:
    profiles: [tools]
    image: ${GF_IMAGE_PREFIX:?Set GF_IMAGE_PREFIX}-api:${GF_IMAGE_TAG:?Set GF_IMAGE_TAG}
    init: true
    entrypoint: [node]
    environment:
      <<: *api-environment
      GF_BACKUP_BUCKET: ${GF_BACKUP_BUCKET:-}
      GF_BACKUP_REGION: ${GF_BACKUP_REGION:-ap-northeast-2}
      GF_BACKUP_ENDPOINT: ${GF_BACKUP_ENDPOINT:-}
      GF_BACKUP_ACCESS_KEY_ID: ${GF_BACKUP_ACCESS_KEY_ID:-}
      GF_BACKUP_SECRET_ACCESS_KEY: ${GF_BACKUP_SECRET_ACCESS_KEY:-}
      NODE_OPTIONS: --max-old-space-size=128
    volumes: [media:/var/lib/game-feedback/media]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  database:
    labels: { dev.side.game-feedback.root: '${GF_DEPLOY_ROOT:-/srv/game-feedback}' }
  media:
    labels: { dev.side.game-feedback.root: '${GF_DEPLOY_ROOT:-/srv/game-feedback}' }
  certificates:
  proxy-config:
