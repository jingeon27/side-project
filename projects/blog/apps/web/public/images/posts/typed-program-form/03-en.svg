<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1320" viewBox="0 0 1080 1320"><title>Share fields, compose differing behavior</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1320" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Share fields, compose differing behavior</tspan></text><rect x="68" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Shared fields</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Program information, images,</tspan><tspan x="96" dy="38">and ordinary template text reuse</tspan><tspan x="96" dy="38">their field implementations in both</tspan><tspan x="96" dy="38">apps.</tspan></text><rect x="552" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Template editor</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">When editing a sub-treatment</tspan><tspan x="580" dy="38">template, the input changes the</tspan><tspan x="580" dy="38">icon and copy together. That</tspan><tspan x="580" dy="38">editor owns the template-specific</tspan><tspan x="580" dy="38">behavior.</tspan></text><rect x="68" y="482" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Program editor</tspan></text><text x="96" y="601" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">When editing a program, the</tspan><tspan x="96" dy="38">corresponding field changes only</tspan><tspan x="96" dy="38">its copy. It keeps the icon</tspan><tspan x="96" dy="38">supplied by the sub-treatment</tspan><tspan x="96" dy="38">template.</tspan></text><rect x="552" y="482" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Defaults from a</tspan><tspan x="580" dy="44">sub-treatment</tspan></text><text x="580" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">When the user changes the</tspan><tspan x="580" dy="38">treatment selection, the</tspan><tspan x="580" dy="38">synchronization logic checks</tspan><tspan x="580" dy="38">touched fields before applying the</tspan><tspan x="580" dy="38">returned defaults.</tspan></text><rect x="68" y="848" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep the difference</tspan><tspan x="96" dy="44">visible</tspan></text><text x="96" y="1011" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Compose the inputs with</tspan><tspan x="96" dy="38">genuinely different behavior</tspan><tspan x="96" dy="38">separately. Avoid copying the rest</tspan><tspan x="96" dy="38">of the form or introducing a</tspan><tspan x="96" dy="38">generic mode for every field.</tspan></text><text x="68" y="1245" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1282" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
