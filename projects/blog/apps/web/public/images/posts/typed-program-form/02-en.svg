<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1358" viewBox="0 0 1080 1358"><title>Connect field paths to their value types</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1358" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Connect field paths to their value types</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Start with the form model</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Create the typed form from IProgramFormCommon or the app&apos;s</tspan><tspan x="96" dy="41">extended interface. Field paths come from that model rather than a</tspan><tspan x="96" dy="41">separate enum of names.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Restrict the field path</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">TFieldNamePath&lt;T&gt; permits a path that exists in the selected form</tspan><tspan x="96" dy="41">model. Shared inputs cannot access fields that exist only in another</tspan><tspan x="96" dy="41">app.</tspan></text><path d="M540 673 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="706" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="754" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Restrict the value</tspan></text><text x="96" y="825" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">TPathValue&lt;T, P&gt; connects a selected path to its value type. A price</tspan><tspan x="96" dy="41">field accepts a number; an unknown path or a string price fails type</tspan><tspan x="96" dy="41">checking.</tspan></text><path d="M540 946 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="979" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1027" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Type the form methods</tspan></text><text x="96" y="1098" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The wrapper carries those path and value types through reads,</tspan><tspan x="96" dy="41">writes, and partial updates. Shared and app-specific models govern</tspan><tspan x="96" dy="41">the methods too.</tspan></text><text x="68" y="1283" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1320" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
