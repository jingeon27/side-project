<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1965" viewBox="0 0 1080 1965"><title>Separate responses, form values, and requests</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1965" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Separate responses, form values, and</tspan><tspan x="68" dy="61">requests</tspan></text><rect x="68" y="221" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="269" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Server response</tspan></text><text x="96" y="340" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Receive nested objects, saved image assets, and template sections</tspan><tspan x="96" dy="41">whose items have orderNo. This shape describes stored data, not</tspan><tspan x="96" dy="41">the editor&apos;s controls.</tspan></text><path d="M540 461 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="494" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="542" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Response adapter to form values</tspan></text><text x="96" y="613" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Convert saved assets to UploadFile values, sort template items,</tspan><tspan x="96" dy="41">build editing arrays, and initialize section visibility. Keep form-only</tspan><tspan x="96" dy="41">fields in the editing model.</tspan></text><path d="M540 734 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="767" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="815" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Edit the form</tspan></text><text x="96" y="886" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Add and remove rows, update images, and toggle sections in the</tspan><tspan x="96" dy="41">shared editing shape. Inputs do not need to know the response or</tspan><tspan x="96" dy="41">request layout.</tspan></text><path d="M540 1007 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1040" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1088" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Request adapter</tspan></text><text x="96" y="1159" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Read assets from UploadFile.response, send the thumbnail ID, and</tspan><tspan x="96" dy="41">rebuild request items. Remove empty titles and assign orderNo from</tspan><tspan x="96" dy="41">the surviving order.</tspan></text><path d="M540 1280 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1313" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1361" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Visibility and deletion</tspan></text><text x="96" y="1432" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Map form visibility back to server enum values. Respect section</tspan><tspan x="96" dy="41">toggles and explicitly submit a removed thumbnail as null rather than</tspan><tspan x="96" dy="41">silently retaining the saved image.</tspan></text><path d="M540 1553 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1586" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1634" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">App-specific requests</tspan></text><text x="96" y="1705" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Keep create/update, inspection, and draft request conversion with</tspan><tspan x="96" dy="41">the app that owns that operation. Share only the conversion rules</tspan><tspan x="96" dy="41">that truly match.</tspan></text><text x="68" y="1890" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1927" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
