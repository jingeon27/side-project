<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1478" viewBox="0 0 1080 1478"><title>When sub-treatment defaults apply</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1478" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">When sub-treatment defaults apply</tspan></text><rect x="68" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Opening a saved program</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Convert the saved detail to form</tspan><tspan x="96" dy="38">values before rendering the</tspan><tspan x="96" dy="38">editor. On screens that reuse the</tspan><tspan x="96" dy="38">same drawer for another record,</tspan><tspan x="96" dy="38">reset its fields from that record.</tspan></text><rect x="552" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">The synchronization</tspan><tspan x="580" dy="44">query runs</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">SyncTreatmentSub fetches the</tspan><tspan x="580" dy="38">detail for the selected</tspan><tspan x="580" dy="38">sub-treatment. Mounting with</tspan><tspan x="580" dy="38">saved IDs alone must not</tspan><tspan x="580" dy="38">overwrite the program&apos;s saved</tspan><tspan x="580" dy="38">template values.</tspan></text><rect x="68" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">The user changes</tspan><tspan x="96" dy="44">treatment selection</tspan></text><text x="96" y="727" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Check whether treatmentId or</tspan><tspan x="96" dy="38">treatmentSubId is touched. A</tspan><tspan x="96" dy="38">user-initiated selection change</tspan><tspan x="96" dy="38">allows the response to supply</tspan><tspan x="96" dy="38">new defaults.</tspan></text><rect x="552" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Fields refreshed from the</tspan><tspan x="580" dy="44">response</tspan></text><text x="580" y="727" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Apply the relevant template</tspan><tspan x="580" dy="38">defaults, including recommended</tspan><tspan x="580" dy="38">audiences, highlights, equipment,</tspan><tspan x="580" dy="38">process, and precautions. Keep</tspan><tspan x="580" dy="38">the set of fields updated in one</tspan><tspan x="580" dy="38">explicit place.</tspan></text><rect x="68" y="968" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1016" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Inspect the operation</tspan><tspan x="96" dy="44">together</tspan></text><text x="96" y="1131" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The query conditions, the</tspan><tspan x="96" dy="38">condition for applying defaults,</tspan><tspan x="96" dy="38">and the updated fields should be</tspan><tspan x="96" dy="38">visible together so a later edit</tspan><tspan x="96" dy="38">does not change only one part of</tspan><tspan x="96" dy="38">the behavior.</tspan></text><text x="68" y="1403" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1440" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
