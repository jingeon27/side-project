<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1364" viewBox="0 0 1080 1364"><title>Shared form values, app-specific fields</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1364" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Shared form values, app-specific fields</tspan></text><rect x="68" y="160" width="460" height="304" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Shared</tspan><tspan x="96" dy="44">IProgramFormCommon</tspan></text><text x="96" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Program name, price, images,</tspan><tspan x="96" dy="38">template sections, and the other</tspan><tspan x="96" dy="38">common editing values belong to</tspan><tspan x="96" dy="38">one shared form model.</tspan></text><rect x="552" y="160" width="460" height="304" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Back-Office form</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Extend the common values with</tspan><tspan x="580" dy="38">operations and inspection-only</tspan><tspan x="580" dy="38">fields. The preview and drawer</tspan><tspan x="580" dy="38">consume the same editing</tspan><tspan x="580" dy="38">values.</tspan></text><rect x="68" y="488" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="536" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Hospital administrator</tspan><tspan x="96" dy="44">form</tspan></text><text x="96" y="651" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Extend the common values with</tspan><tspan x="96" dy="38">the hospital application&apos;s own</tspan><tspan x="96" dy="38">fields and request state. Do not</tspan><tspan x="96" dy="38">expose Back-Office-only fields</tspan><tspan x="96" dy="38">through the common interface.</tspan></text><rect x="552" y="488" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="536" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Shared input</tspan><tspan x="580" dy="44">implementation</tspan></text><text x="580" y="651" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">An input used in both apps reads</tspan><tspan x="580" dy="38">the shared model. App-only fields</tspan><tspan x="580" dy="38">remain available only through the</tspan><tspan x="580" dy="38">matching extended form type.</tspan></text><rect x="68" y="854" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="902" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Preserve the input</tspan><tspan x="96" dy="44">behavior</tspan></text><text x="96" y="1017" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Only fields whose behavior differs</tspan><tspan x="96" dy="38">between the apps get different</tspan><tspan x="96" dy="38">composition. The other fields</tspan><tspan x="96" dy="38">reuse the same implementation</tspan><tspan x="96" dy="38">without a growing collection of</tspan><tspan x="96" dy="38">mode flags.</tspan></text><text x="68" y="1289" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1326" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
