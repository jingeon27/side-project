<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1478" viewBox="0 0 1080 1478"><title>Specifications and bug regressions</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1478" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Specifications and bug regressions</tspan></text><rect x="68" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">*.spec.ts(x): expected</tspan><tspan x="96" dy="44">behavior</tspan></text><text x="96" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Describe a new feature or</tspan><tspan x="96" dy="38">screen&apos;s expected behavior, or a</tspan><tspan x="96" dy="38">contract that should remain</tspan><tspan x="96" dy="38">stable during a change. It should</tspan><tspan x="96" dy="38">pass before and after a</tspan><tspan x="96" dy="38">behavior-preserving refactor.</tspan></text><rect x="552" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">*.test.ts(x): a reproduced</tspan><tspan x="580" dy="44">bug</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Start with a test that fails for the</tspan><tspan x="580" dy="38">reported defect. Fix the</tspan><tspan x="580" dy="38">implementation, then confirm the</tspan><tspan x="580" dy="38">same test passes. Keep it distinct</tspan><tspan x="580" dy="38">even when a specification</tspan><tspan x="580" dy="38">already covers the target.</tspan></text><rect x="68" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Verify the test itself</tspan></text><text x="96" y="683" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">A new test pattern needs a</tspan><tspan x="96" dy="38">deliberate implementation break.</tspan><tspan x="96" dy="38">Confirm the failure comes from</tspan><tspan x="96" dy="38">the intended condition rather than</tspan><tspan x="96" dy="38">from setup or a label that was</tspan><tspan x="96" dy="38">never present.</tspan></text><rect x="552" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Choose the smallest</tspan><tspan x="580" dy="44">useful boundary</tspan></text><text x="580" y="727" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Use node tests for pure</tspan><tspan x="580" dy="38">calculations, jsdom for ordinary</tspan><tspan x="580" dy="38">component behavior, a real</tspan><tspan x="580" dy="38">browser for browser-dependent</tspan><tspan x="580" dy="38">behavior, and Playwright for user</tspan><tspan x="580" dy="38">flows.</tspan></text><rect x="68" y="968" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1016" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Use real external</tspan><tspan x="96" dy="44">boundaries selectively</tspan></text><text x="96" y="1131" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">API and database integration</tspan><tspan x="96" dy="38">checks exercise the actual</tspan><tspan x="96" dy="38">constraints that a simple mock</tspan><tspan x="96" dy="38">would miss. Do not launch both</tspan><tspan x="96" dy="38">applications for every isolated</tspan><tspan x="96" dy="38">component test.</tspan></text><text x="68" y="1403" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1440" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
