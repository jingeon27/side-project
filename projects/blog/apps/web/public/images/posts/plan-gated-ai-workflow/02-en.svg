<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1781" viewBox="0 0 1080 1781"><title>Where I review the agent&apos;s work</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1781" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Where I review the agent&apos;s work</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Ticket and plan review</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The ticket-branch skill proposes the scope, affected areas,</tspan><tspan x="96" dy="41">implementation sequence, and points needing review.</tspan><tspan x="96" dy="41">Implementation waits for plan approval.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Tests and implementation</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Write expected behavior as specifications and reproduce reported</tspan><tspan x="96" dy="41">bugs as regression tests. Verify a new testing pattern by deliberately</tspan><tspan x="96" dy="41">breaking the implementation.</tspan></text><path d="M540 673 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="706" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="754" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Agent code review</tspan></text><text x="96" y="825" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">A review agent reads the diff and records severity and confidence for</tspan><tspan x="96" dy="41">each finding. Fix findings and repeat the relevant checks.</tspan></text><path d="M540 905 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="938" width="944" height="190" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="986" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Changed-file checks</tspan></text><text x="96" y="1057" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The push gate runs the checks selected for the changed files,</tspan><tspan x="96" dy="41">including tests, lint, typecheck, and unused-code checks.</tspan></text><path d="M540 1137 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1170" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1218" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">5. My review</tspan></text><text x="96" y="1289" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">I read the implementation diff and try the dev screens. If behavior or</tspan><tspan x="96" dy="41">structure differs from what I wanted, I request another change.</tspan></text><path d="M540 1369 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1402" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1450" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">6. CI and QA</tspan></text><text x="96" y="1521" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">CI verifies the integrated result. A separate QA check follows where</tspan><tspan x="96" dy="41">needed; unresolved findings return to the same implementation</tspan><tspan x="96" dy="41">session.</tspan></text><text x="68" y="1706" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1743" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
