<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1590" viewBox="0 0 1080 1590"><title>Verify the cross-app failure path</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1590" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Verify the cross-app failure path</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Isolate the browser setup</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">A separate Playwright configuration starts the portal and</tspan><tspan x="96" dy="41">administrator apps. Keeping it outside either app&apos;s ordinary E2E</tspan><tspan x="96" dy="41">setup avoids starting the other server on every run.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Keep sessions separate</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Sign in to each app and save its own session state. Open separate</tspan><tspan x="96" dy="41">browser contexts so cookies on localhost cannot mix the two</tspan><tspan x="96" dy="41">sessions.</tspan></text><path d="M540 673 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="706" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="754" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Reproduce the rejected request</tspan></text><text x="96" y="825" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Prepare the record in one app and exercise the corresponding action</tspan><tspan x="96" dy="41">in the other. Enter the actual rejection reason through the interface.</tspan></text><path d="M540 905 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="938" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="986" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Check the outcome</tspan></text><text x="96" y="1057" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Assert that the record and the visible reason changed as expected. A</tspan><tspan x="96" dy="41">pre-existing label or a hidden upload message is not evidence that</tspan><tspan x="96" dy="41">the rejection flow worked.</tspan></text><path d="M540 1178 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1211" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1259" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep evidence tied to the action</tspan></text><text x="96" y="1330" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The test should fail if the mutation or its result is broken. Verify the</tspan><tspan x="96" dy="41">state produced by the submitted reason rather than a</tspan><tspan x="96" dy="41">success-shaped message alone.</tspan></text><text x="68" y="1515" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1552" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
