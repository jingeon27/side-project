<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1364" viewBox="0 0 1080 1364"><title>Where repeated feedback belongs</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1364" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Where repeated feedback belongs</tspan></text><rect x="68" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Find a recurring</tspan><tspan x="96" dy="44">correction</tspan></text><text x="96" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">An implementation differs from</tspan><tspan x="96" dy="38">the intended behavior or</tspan><tspan x="96" dy="38">structure. Tests, diff review, or</tspan><tspan x="96" dy="38">screen checks make the problem</tspan><tspan x="96" dy="38">visible.</tspan></text><rect x="552" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">A judgment based on</tspan><tspan x="580" dy="44">code</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Use a lint rule for patterns that</tspan><tspan x="580" dy="38">can be decided from the code</tspan><tspan x="580" dy="38">alone, such as a prohibited</tspan><tspan x="580" dy="38">import or a repeated</tspan><tspan x="580" dy="38">implementation pattern.</tspan></text><rect x="68" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">A repeated type of task</tspan></text><text x="96" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Put the procedure and</tspan><tspan x="96" dy="38">task-specific decisions in a skill.</tspan><tspan x="96" dy="38">Invoke it when that kind of work is</tspan><tspan x="96" dy="38">requested.</tspan></text><rect x="552" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">A repository-wide starting</tspan><tspan x="580" dy="44">rule</tspan></text><text x="580" y="689" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Keep entry points and rules that</tspan><tspan x="580" dy="38">apply to the whole repository in</tspan><tspan x="580" dy="38">AGENTS.md. Link to the owning</tspan><tspan x="580" dy="38">skill instead of copying its entire</tspan><tspan x="580" dy="38">procedure.</tspan></text><rect x="68" y="892" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="940" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Behavior that must keep</tspan><tspan x="96" dy="44">working</tspan></text><text x="96" y="1055" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Record the expected behavior in</tspan><tspan x="96" dy="38">a specification. Reproduce a</tspan><tspan x="96" dy="38">confirmed bug in a regression</tspan><tspan x="96" dy="38">test and check that the test fails</tspan><tspan x="96" dy="38">before the fix.</tspan></text><rect x="552" y="892" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="940" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Keep the original</tspan><tspan x="580" dy="44">judgment</tspan></text><text x="580" y="1055" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Updating a rule does not replace</tspan><tspan x="580" dy="38">the product decision. I still review</tspan><tspan x="580" dy="38">the resulting diff and behavior</tspan><tspan x="580" dy="38">when the implementation needs</tspan><tspan x="580" dy="38">that judgment.</tspan></text><text x="68" y="1289" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1326" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
