<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1631" viewBox="0 0 1080 1631"><title>Application, checkout, and recovery</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1631" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Application, checkout, and recovery</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Complete the application</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Provide selected examinations, the participant, preferred time,</tspan><tspan x="96" dy="41">eligibility details, address, and any company examination code.</tspan><tspan x="96" dy="41">Entered codes must be checked before applying.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Review the confirmation sheet</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Show the hospital, program, selected examinations, participant,</tspan><tspan x="96" dy="41">preferred visit time, expected cost, deposit, and expected on-site</tspan><tspan x="96" dy="41">payment.</tspan></text><path d="M540 673 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="706" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="754" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Let checkout decide</tspan></text><text x="96" y="825" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The server decides whether payment is required. With no deposit,</tspan><tspan x="96" dy="41">the application can complete directly; otherwise checkout creates an</tspan><tspan x="96" dy="41">order.</tspan></text><path d="M540 946 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="979" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1027" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Handle the payment result</tspan></text><text x="96" y="1098" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Approval continues to application completion and reservation details.</tspan><tspan x="96" dy="41">Failure or cancellation keeps a route back to the same application for</tspan><tspan x="96" dy="41">another attempt.</tspan></text><path d="M540 1219 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1252" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1300" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep only the necessary order state</tspan></text><text x="96" y="1371" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Temporary order and application information connects checkout to</tspan><tspan x="96" dy="41">the payment result. Do not treat a previous result or a closed window</tspan><tspan x="96" dy="41">as a new successful application.</tspan></text><text x="68" y="1556" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1593" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
