<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Treatment and health-check flows</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1920" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Treatment and health-check flows</tspan></text><rect x="68" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Treatment: hospital</tspan><tspan x="96" dy="44">administrator</tspan></text><text x="96" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Create the program with</tspan><tspan x="96" dy="38">information, prices, and detail</tspan><tspan x="96" dy="38">images. Save a draft or request</tspan><tspan x="96" dy="38">review for a new program, an</tspan><tspan x="96" dy="38">edit, or deletion.</tspan></text><rect x="552" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Health check: Back-Office</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Operations registers the</tspan><tspan x="580" dy="38">information, price, deposit,</tspan><tspan x="580" dy="38">required examinations, and</tspan><tspan x="580" dy="38">groups that require exactly N</tspan><tspan x="580" dy="38">selections.</tspan></text><rect x="68" y="526" width="460" height="418" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Treatment: review</tspan></text><text x="96" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Operations reviews the request.</tspan><tspan x="96" dy="38">Rejection includes a reason</tspan><tspan x="96" dy="38">visible to the partner; approval</tspan><tspan x="96" dy="38">creates or updates the program</tspan><tspan x="96" dy="38">and its publication schedule.</tspan></text><rect x="552" y="526" width="460" height="418" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Health check: read-only</tspan><tspan x="580" dy="44">administration</tspan></text><text x="580" y="689" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The hospital administrator can</tspan><tspan x="580" dy="38">inspect the health-check</tspan><tspan x="580" dy="38">program, including its</tspan><tspan x="580" dy="38">examination setup. Those fields</tspan><tspan x="580" dy="38">are locked; the treatment</tspan><tspan x="580" dy="38">review-request flow is</tspan><tspan x="580" dy="38">unavailable.</tspan></text><rect x="68" y="968" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1016" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Treatment: customer</tspan><tspan x="96" dy="44">portal</tspan></text><text x="96" y="1131" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Show the detail page and any</tspan><tspan x="96" dy="38">coupon-adjusted price. The</tspan><tspan x="96" dy="38">visitor can ask for a phone</tspan><tspan x="96" dy="38">consultation or choose a visit</tspan><tspan x="96" dy="38">reservation.</tspan></text><rect x="552" y="968" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="1016" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Health check: customer</tspan><tspan x="580" dy="44">portal</tspan></text><text x="580" y="1131" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Show the required examinations</tspan><tspan x="580" dy="38">and the required count for each</tspan><tspan x="580" dy="38">optional group. Complete those</tspan><tspan x="580" dy="38">selections before applying; no</tspan><tspan x="580" dy="38">treatment coupon or</tspan><tspan x="580" dy="38">phone-consultation action.</tspan></text><rect x="68" y="1372" width="460" height="418" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1420" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Reservation and payment</tspan></text><text x="96" y="1491" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">A health-check application</tspan><tspan x="96" dy="38">includes the selected</tspan><tspan x="96" dy="38">examinations and other</tspan><tspan x="96" dy="38">application fields. The</tspan><tspan x="96" dy="38">confirmation sheet shows the</tspan><tspan x="96" dy="38">deposit and expected on-site</tspan><tspan x="96" dy="38">amount.</tspan></text><rect x="552" y="1372" width="460" height="418" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="1420" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Server decides the next</tspan><tspan x="580" dy="44">step</tspan></text><text x="580" y="1535" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">A required deposit opens</tspan><tspan x="580" dy="38">payment and proceeds after</tspan><tspan x="580" dy="38">approval. A fully supported or</tspan><tspan x="580" dy="38">zero-deposit application</tspan><tspan x="580" dy="38">completes without the payment</tspan><tspan x="580" dy="38">window, then opens reservation</tspan><tspan x="580" dy="38">details.</tspan></text><text x="68" y="1845" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1882" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
