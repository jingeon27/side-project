<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1276" viewBox="0 0 1080 1276"><title>One examination setup, four views</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1276" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">One examination setup, four views</tspan></text><rect x="68" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Shared configuration</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">includedItemIds holds the</tspan><tspan x="96" dy="38">required examinations.</tspan><tspan x="96" dy="38">selectionItemGroups defines a</tspan><tspan x="96" dy="38">name, pickCount, and the</tspan><tspan x="96" dy="38">selectable item IDs for each</tspan><tspan x="96" dy="38">optional group.</tspan></text><rect x="552" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Selection constraints</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">An examination item belongs to</tspan><tspan x="580" dy="38">only one place. Items already</tspan><tspan x="580" dy="38">used by another group are</tspan><tspan x="580" dy="38">disabled; every group&apos;s</tspan><tspan x="580" dy="38">pickCount must be met before</tspan><tspan x="580" dy="38">application.</tspan></text><rect x="68" y="520" width="460" height="304" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Back-Office editor</tspan></text><text x="96" y="639" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Edit the required items and</tspan><tspan x="96" dy="38">optional groups. Choose each</tspan><tspan x="96" dy="38">group&apos;s examination items and</tspan><tspan x="96" dy="38">required count, then save the</tspan><tspan x="96" dy="38">setup.</tspan></text><rect x="552" y="520" width="460" height="304" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Hospital administrator</tspan><tspan x="580" dy="44">detail</tspan></text><text x="580" y="683" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Read the same setup through</tspan><tspan x="580" dy="38">locked inputs. The administrator</tspan><tspan x="580" dy="38">cannot change the health-check</tspan><tspan x="580" dy="38">configuration.</tspan></text><rect x="68" y="848" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Portal summary</tspan></text><text x="96" y="967" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Show the number of required</tspan><tspan x="96" dy="38">items and an expandable</tspan><tspan x="96" dy="38">summary of each optional group</tspan><tspan x="96" dy="38">and its pick count.</tspan></text><rect x="552" y="848" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Portal selection</tspan></text><text x="580" y="967" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Choose the exact number for</tspan><tspan x="580" dy="38">each optional group. The</tspan><tspan x="580" dy="38">confirmation action becomes</tspan><tspan x="580" dy="38">available when every group is</tspan><tspan x="580" dy="38">complete.</tspan></text><text x="68" y="1201" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1238" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
