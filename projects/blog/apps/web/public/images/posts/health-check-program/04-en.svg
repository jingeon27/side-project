<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1276" viewBox="0 0 1080 1276"><title>Select exactly the required count</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1276" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Select exactly the required count</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. A group is still incomplete</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Example: imaging requires three choices, but only two are selected.</tspan><tspan x="96" dy="41">The visitor can add another available item. The overall confirmation</tspan><tspan x="96" dy="41">action stays disabled.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="190" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. A group reaches its limit</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Keep the selected items active so they can be removed. Disable the</tspan><tspan x="96" dy="41">remaining items in that group instead of replacing an earlier choice.</tspan></text><path d="M540 632 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="665" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="713" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. All groups are complete</tspan></text><text x="96" y="784" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Enable confirmation only when every optional group reaches its own</tspan><tspan x="96" dy="41">pickCount. Missing selections in another group still block it.</tspan></text><path d="M540 864 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="897" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="945" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep logic and display separate</tspan></text><text x="96" y="1016" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The selection operation only adds or removes an item. The UI</tspan><tspan x="96" dy="41">enforces the limit and explains the remaining count; selection logic</tspan><tspan x="96" dy="41">does not evict another item.</tspan></text><text x="68" y="1201" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1238" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
