<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="998" viewBox="0 0 1080 998"><title>Choose the detail view at the page</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="998" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Choose the detail view at the page</tspan></text><rect x="68" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Program detail page</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Query the program, record the</tspan><tspan x="96" dy="38">recently viewed treatment, and</tspan><tspan x="96" dy="38">check whether</tspan><tspan x="96" dy="38">programInfo.healthCheck is</tspan><tspan x="96" dy="38">present.</tspan></text><rect x="552" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">No healthCheck:</tspan><tspan x="580" dy="44">treatment view</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Compose the treatment header,</tspan><tspan x="580" dy="38">images, tabs, price,</tspan><tspan x="580" dy="38">benefit-adjusted price, and</tspan><tspan x="580" dy="38">treatment details. Offer phone</tspan><tspan x="580" dy="38">consultation and visit reservation.</tspan></text><rect x="68" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">healthCheck present:</tspan><tspan x="96" dy="44">health-check view</tspan></text><text x="96" y="689" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Compose the health-check</tspan><tspan x="96" dy="38">header, images, tabs, price, and</tspan><tspan x="96" dy="38">examination groups. Offer visit</tspan><tspan x="96" dy="38">reservation with the examination</tspan><tspan x="96" dy="38">selection step.</tspan></text><rect x="552" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Keep each view explicit</tspan></text><text x="580" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The page chooses the view. Each</tspan><tspan x="580" dy="38">view assembles its own screen</tspan><tspan x="580" dy="38">instead of receiving a growing</tspan><tspan x="580" dy="38">collection of flags for unrelated</tspan><tspan x="580" dy="38">sections.</tspan></text><text x="68" y="923" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="960" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
