<text x="68" y="64" fill="#65766e" font-size="25" letter-spacing="2">02 / INTERFACE COPY FEEDBACK</text>
<text x="68" y="130" fill="#243b34" font-size="44" font-weight="700">Describe what the user can do</text>
<rect x="68" y="180" width="944" height="290" rx="20" fill="#fffdf8" stroke="#d5bbb0" stroke-width="2"/>
<rect x="100" y="210" width="130" height="45" rx="10" fill="#f5e6de"/>
<text x="119" y="241" fill="#9c553d" font-size="27" font-weight="700">Before</text>
<text x="112" y="318" font-size="38" fill="#76594d">Start a chat from posts · profiles</text><text x="112" y="376" font-size="38" fill="#76594d">— send photos · videos, too.</text>
<path d="M540 486 V520 M526 507 L540 521 L554 507" fill="none" stroke="#7b8c80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
