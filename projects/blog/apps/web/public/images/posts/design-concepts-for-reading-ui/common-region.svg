<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="456" viewBox="0 0 1080 456" role="img" aria-labelledby="title desc"><title id="title">설정 항목의 공통 영역</title><desc id="desc">같은 위치의 설정 항목에 배경 영역만 더해 묶음을 드러낸 비교.</desc><rect width="1080" height="456" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">배경 없이 나열했어요</text><rect x="36" y="84" width="492" height="336" rx="18" fill="#e8edf5" stroke="none" stroke-width="0"/><text x="68" y="156" font-size="32" font-weight="400" fill="#18243f">댓글 알림</text><rect x="424" y="126" width="72" height="40" rx="20" fill="#dbe2ec" stroke="none" stroke-width="0"/><circle cx="444" cy="146" r="15" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="68" y="230" font-size="32" font-weight="400" fill="#18243f">좋아요 알림</text><rect x="424" y="200" width="72" height="40" rx="20" fill="#dbe2ec" stroke="none" stroke-width="0"/><circle cx="444" cy="220" r="15" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="68" y="304" font-size="32" font-weight="400" fill="#18243f">프로필 공개</text><rect x="424" y="274" width="72" height="40" rx="20" fill="#dbe2ec" stroke="none" stroke-width="0"/><circle cx="444" cy="294" r="15" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="68" y="378" font-size="32" font-weight="400" fill="#18243f">활동 공개</text><rect x="424" y="348" width="72" height="40" rx="20" fill="#dbe2ec" stroke="none" stroke-width="0"/><circle cx="444" cy="368" r="15" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">배경 영역만 더했어요</text><rect x="552" y="84" width="492" height="336" rx="18" fill="#e8edf5" stroke="none" stroke-width="0"/><rect x="562" y="114" width="472" height="138" rx="14" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="562" y="262" width="472" height="138" rx="14" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><te