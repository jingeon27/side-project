<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">주 행동과 보조 행동의 강도</title><desc id="desc">임시 저장과 게시하기 버튼의 강도를 같게 또는 다르게 표현한 비교.</desc><rect width="1080" height="420" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">강도가 같아요</text><rect x="36" y="84" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="142" font-size="34" font-weight="700" fill="#18243f">새 글 작성</text><rect x="64" y="168" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="64" y="202" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="64" y="280" width="210" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="169" y="327" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">임시 저장</text><rect x="290" y="280" width="210" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="395" y="327" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">게시하기</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">주 행동이 분명해요</text><rect x="552" y="84" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="142" font-size="34" font-weight="700" fill="#18243f">새 글 작성</text><rect x="580" y="168" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="580" y="202" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="580" y="280" width="210" height="72" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="685" y="327" font-size="30" font-weight="600" fill="#536074" text-anchor="middle">임시 저장</text><rect x="806" y="280" width="210" height="72" rx="10" fill="#a85b20" stroke="#a8