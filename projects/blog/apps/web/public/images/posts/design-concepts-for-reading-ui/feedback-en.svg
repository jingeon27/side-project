<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="586" viewBox="0 0 1080 586" role="img" aria-labelledby="title desc"><title id="title">Publish states and retry</title><desc id="desc">A publish request goes through a pending state, then succeeds or fails with an option to retry.</desc><rect width="1080" height="586" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><rect x="36" y="64" width="286" height="72" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="179" y="111" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Press Publish</text><path d="M332 100h34m-12-12 12 12-12 12" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="384" y="36" width="660" height="128" rx="18" fill="#18243f" stroke="#18243f" stroke-width="2"/><text x="416" y="92" font-size="36" font-weight="700" fill="#fff">Publishing…</text><text x="416" y="138" font-size="28" font-weight="400" fill="#dce4f0">Your request is being processed.</text><path d="M714 170V214M282 214H798M282 214V242m-10-12 10 12 10-12M798 214V242m-10-12 10 12 10-12" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="250" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="304" font-size="30" font-weight="700" fill="#23604a">Success</text><text x="64" y="362" font-size="36" font-weight="700" fill="#18243f">Published.</text><text x="64" y="416" font-size="28" font-weight="400" fill="#536074">See the result in your post.</text><rect x="552" y="250" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="304" font-size="30" font-weight="700" fill="#94511d">Failure</text><text x="580" y="362" font-size="36" font-weight="700" fill="#18243f">Could not publish.</text><text x="580" y="416" font-size="28" font-weight="400" fill="#536074">Your draft is still here.</text><rect x="580" y="450" width="436" height="72" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="798" y="497" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">Try again</text></g></svg>
