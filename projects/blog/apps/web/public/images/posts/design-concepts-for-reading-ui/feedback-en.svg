<svg xmlns="http://www.w3.org/2000/svg" width="600" height="930" viewBox="0 0 600 930" role="img" aria-labelledby="title"><title id="title">Publishing states and retry</title><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#18243f}.muted{fill:#536074}</style><rect x="0" y="0" width="600" height="930" rx="0" fill="#f2f5fa" stroke="#f2f5fa"/><text x="24" y="45" font-size="30" font-weight="650" class="">After pressing Publish</text><rect x="64" y="76" width="512" height="169" rx="18" fill="#18243f" stroke="#18243f"/><text x="94" y="137" font-size="34" font-weight="650" class="" style="fill:#fff">Publishing…</text><text x="94" y="190" font-size="25" font-weight="400" class="" style="fill:#dce4f0">The request is still pending.</text><path d="M320 245V282H24V712M24 422H56m-10-10 10 10-10 10M24 712H56m-10-10 10 10-10 10" stroke="#64748b" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="64" y="345" width="512" height="174" rx="18" fill="#fff" stroke="#a5b1c3"/><text x="94" y="388" font-size="25" font-weight="650" class="" style="fill:#23604a">Success</text><text x="94" y="436" font-size="32" font-weight="700" class="">Post published.</text><text x="94" y="482" font-size="24" font-weight="400" class="muted">Open the post to see the result.</text><rect x="64" y="594" width="512" height="280" rx="18" fill="#fff" stroke="#a5b1c3"/><text x="94" y="640" font-size="25" font-weight="650" class="" style="fill:#94511d">Failure</text><text x="94" y="688" font-size="29" font-weight="700" class="">The post was not saved.</text><text x="94" y="735" font-size="25" font-weight="400" class="muted">Your draft is still here.</text><rect x="94" y="774" width="452" height="63" rx="10" fill="#fff3e7" stroke="#d8a572"/><text text-anchor="middle" x="320" y="815" font-size="28" font-weight="650" class="">Retry</text></svg>
