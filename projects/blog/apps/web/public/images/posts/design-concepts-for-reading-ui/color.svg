<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="444" viewBox="0 0 1080 444" role="img" aria-labelledby="title desc"><title id="title">색상, 채도, 명도</title><desc id="desc">같은 파란색에서 색상, 채도, 명도를 하나씩 바꾼 비교.</desc><rect width="1080" height="444" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="80" font-size="36" font-weight="700" fill="#18243f">색상</text><text x="36" y="124" font-size="28" font-weight="400" fill="#536074">어떤 계열인가</text><rect x="378" y="36" width="310" height="108" rx="12" fill="hsl(220 80% 50%)" stroke="none" stroke-width="0"/><text x="533" y="99" font-size="26" font-weight="400" fill="#fff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(220 80% 50%)</text><path d="M696 90h22m-10-10 10 10-10 10" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="734" y="36" width="310" height="108" rx="12" fill="hsl(0 80% 50%)" stroke="none" stroke-width="0"/><text x="889" y="99" font-size="26" font-weight="400" fill="#fff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(0 80% 50%)</text><text x="36" y="212" font-size="36" font-weight="700" fill="#18243f">채도</text><text x="36" y="256" font-size="28" font-weight="400" fill="#536074">얼마나 선명한가</text><rect x="378" y="168" width="310" height="108" rx="12" fill="hsl(220 80% 50%)" stroke="none" stroke-width="0"/><text x="533" y="231" font-size="26" font-weight="400" fill="#fff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(220 80% 50%)</text><path d="M696 222h22m-10-10 10 10-10 10" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="734" y="168" width="310" height="108" rx="12" fill="hsl(220 25% 50%)" stroke="none" stroke-width="0"/><text x="889" y="231" font-size="26" font-weight="400" fill="#fff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(220 25% 50%)</text><text x="36" y="344" font-size="36" font-weight="700" fill="#18243f">명도</text><text x="36" y="388" font-size="28" font-weight="400" fill="#536074">얼마나 밝은가</text><rect x="378" y="300" width="310" height="108" rx="12" fill="hsl(220 80% 50%)" stroke="none" stroke-width="0"/><text x="533" y="363" font-size="26" font-weight="400" fill="#fff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(220 80% 50%)</text><path d="M696 354h22m-10-10 10 10-10 10" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="734" y="300" width="310" height="108" rx="12" fill="hsl(220 80% 78%)" stroke="none" stroke-width="0"/><text x="889" y="363" font-size="26" font-weight="400" fill="#18243f" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hsl(220 80% 78%)</text></g></svg>
