<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="646" viewBox="0 0 1080 646" role="img" aria-labelledby="title desc"><title id="title">Progressive disclosure</title><desc id="desc">A search screen with every filter open compared with one that shows common filters first.</desc><rect width="1080" height="646" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Every filter is open</text><rect x="36" y="84" width="492" height="526" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="64" y="110" width="436" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="86" y="157" font-size="30" font-weight="400" fill="#7b8798">Search coaching</text><rect x="64" y="202" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="166" y="242" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Game</text><rect x="296" y="202" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="398" y="242" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Price</text><rect x="64" y="278" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="166" y="318" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Time</text><rect x="296" y="278" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="398" y="318" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Day</text><rect x="64" y="354" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="166" y="394" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Rank</text><rect x="296" y="354" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="398" y="394" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Language</text><rect x="64" y="430" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="166" y="470" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Role</text><rect x="296" y="430" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="398" y="470" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Reviews</text><rect x="64" y="506" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="166" y="546" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Experience</text><rect x="296" y="506" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="398" y="546" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Region</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Common filters first</text><rect x="552" y="84" width="492" height="526" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="580" y="110" width="436" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="602" y="157" font-size="30" font-weight="400" fill="#7b8798">Search coaching</text><rect x="580" y="202" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="682" y="242" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Game</text><rect x="812" y="202" width="204" height="58" rx="29" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="914" y="242" font-size="28" font-weight="500" fill="#18243f" text-anchor="middle">Price</text><rect x="580" y="288" width="436" height="70" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="602" y="334" font-size="30" font-weight="600" fill="#18243f">More filters</text><path d="M968 317l10 11 10-11" fill="none" stroke="#18243f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="406" 