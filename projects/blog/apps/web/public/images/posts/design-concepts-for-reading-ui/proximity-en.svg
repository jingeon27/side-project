<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Spacing in a form</title><desc id="desc">A form with equal gaps compared with one that tightens spacing inside each group.</desc><rect width="1080" height="520" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Every gap is the same</text><rect x="36" y="84" width="492" height="400" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="146" font-size="30" font-weight="600" fill="#18243f">Nickname</text><rect x="64" y="176" width="300" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="306" font-size="30" font-weight="600" fill="#18243f">Contact</text><rect x="64" y="336" width="300" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Wider gaps between groups</text><rect x="552" y="84" width="492" height="400" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="146" font-size="30" font-weight="600" fill="#18243f">Nickname</text><rect x="580" y="160" width="300" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="300" font-size="30" font-weight="600" fill="#18243f">Contact</text><rect x="580" y="314" width="300" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><path d="M898 148h10V160h-10" fill="none" stroke="#a85b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="916" y="164" font-size="28" font-weight="600" fill="#a85b20">8px</text><path d="M898 230h10V276h-10" fill="none" stroke="#a85b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="916" y="263" font-size="28" font-weight="600" fill="#a85b20">24px</text><text x="1016" y="458" font-size="28" font-weight="400" fill="#536074" text-anchor="end">Gap values are examples</text></g></svg>
