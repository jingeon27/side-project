<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Primary and secondary action strength</title><desc id="desc">Save draft and Publish shown with equal strength, then with Publish emphasized.</desc><rect width="1080" height="420" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Equal strength</text><rect x="36" y="84" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="142" font-size="34" font-weight="700" fill="#18243f">New post</text><rect x="64" y="168" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="64" y="202" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="64" y="280" width="210" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="169" y="327" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Save draft</text><rect x="290" y="280" width="210" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="395" y="327" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Publish</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Clear primary action</text><rect x="552" y="84" width="492" height="300" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="142" font-size="34" font-weight="700" fill="#18243f">New post</text><rect x="580" y="168" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="580" y="202" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="580" y="280" width="210" height="72" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="685" y="327" font-size="30" font-weight="600" fill="#536074" text-anchor="middle">Save draft</text><rect x="806" y="280" width="210" height="72" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="911" y="327" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Publish</text></g></svg>
