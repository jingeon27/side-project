<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc"><title id="title">Recall and recognition</title><desc id="desc">Typing a player tag from memory compared with choosing a saved account from a list.</desc><rect width="1080" height="490" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Recall: type from memory</text><rect x="36" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="144" font-size="30" font-weight="600" fill="#18243f">Player tag</text><rect x="64" y="166" width="436" height="76" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="86" y="216" font-size="30" font-weight="400" fill="#7b8798">Enter your tag</text><text x="64" y="312" font-size="30" font-weight="400" fill="#536074">What was my tag again?</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Recognition: pick from a list</text><rect x="552" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="144" font-size="30" font-weight="600" fill="#18243f">Saved accounts</text><rect x="580" y="166" width="436" height="62" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><circle cx="614" cy="197" r="13" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="642" y="208" font-size="28" font-weight="600" fill="#18243f">MoonArcher#KR1</text><rect x="580" y="238" width="436" height="62" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><circle cx="614" cy="269" r="13" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="642" y="280" font-size="28" font-weight="400" fill="#18243f">DawnJungle#1234</text><rect x="580" y="310" width="436" height="62" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><circle cx="614" cy="341" r="13" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="642" y="352" font-size="28" font-weight="400" fill="#18243f">LateNight#2222</text><text x="580" y="424" font-size="30" font-weight="600" fill="#a85b20">That one is mine</text></g></svg>
