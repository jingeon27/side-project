<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">뒤로 가기에 대한 예상</title><desc id="desc">검색 결과에서 글을 열었다가 돌아왔을 때 목록이 초기화되는 경우와 검색어와 위치가 남는 경우의 비교.</desc><rect width="1080" height="600" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><rect x="36" y="30" width="294.6666666666667" height="70" rx="35" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="183.33333333333334" y="76" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">검색</text><path d="M342.6666666666667 65h34m-12-12 12 12-12 12" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="392.6666666666667" y="30" width="294.6666666666667" height="70" rx="35" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="540" y="76" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">글 열기</text><path d="M699.3333333333334 65h34m-12-12 12 12-12 12" fill="none" stroke="#536074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="749.3333333333334" y="30" width="294.6666666666667" height="70" rx="35" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="896.6666666666667" y="76" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">뒤로 가기</text><text x="36" y="156" font-size="34" font-weight="700" fill="#536074">전체 목록으로 초기화</text><rect x="36" y="182" width="492" height="382" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="64" y="206" width="436" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="86" y="253" font-size="30" font-weight="400" fill="#7b8798">코칭 검색</text><rect x="64" y="292" width="436" height="56" rx="8" fill="#fff" stroke="#d6dde8" stroke-width="2"/><text x="82" y="330" font-size="28" font-weight="400" fill="#18243f">전체 인기 글</text><rect x="64" y="356" width="436" height="56" rx="8" fill="#fff" stroke="#d6dde8" stroke-width="2"/><text x="82" y="394" font-size="28" font-weight="400" fill="#18243f">오늘의 추천</text><rect x="64" y="420" width="436" height="56" rx="8" fill="#fff" stroke="#d6dde8" stroke-width="2"/><text x="82" y="458" font-size="28" font-weight="400" fill="#18243f">새 글 모음</text><text x="64" y="528" font-size="30" font-weight="400" fill="#536074">보던 내용이 사라졌어요</text><text x="552" y="156" font-size="34" font-weight="700" fill="#a85b20">검색어와 위치가 남아요</text><rect x="552" y="182" width="492" height="382" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="580" y="206" width="436" height="70" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="602" y="253" font-size="30" font-weight="600" fill="#18243f">역공</text><rect x="580" y="292" width="436" height="56" rx="8" fill="#fff" stroke="#d6dde8" stroke-width="2"/><text x="598" y="330" font-size="28" font-weight="400" fill="#18243f">역공 타이밍 질문</text><rect x="580" y="356" width="436" height="56" rx="8" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="598" y="394" font-size="28" font-weight="600" fill="#18243f">역공 연습 방법</text><rect x="580" y="420" width="436" height="56" rx="8" fill="#fff" stroke="#d6dde8" stroke-width="2"/><text x="598" y="458" font-size="28" font-weight="400" fill="#18243f">역공 후 거리 조절</text><text x="580" y="528" font-size="30" font-weight="600" fill="#a85b20">보던 글이 그대로 보여요</text></g></svg>
