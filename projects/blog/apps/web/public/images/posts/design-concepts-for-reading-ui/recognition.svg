<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc"><title id="title">회상과 재인</title><desc id="desc">플레이어 태그를 기억해서 입력하는 화면과 저장된 계정을 보고 고르는 화면의 비교.</desc><rect width="1080" height="490" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">회상: 기억해서 입력해요</text><rect x="36" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="144" font-size="30" font-weight="600" fill="#18243f">플레이어 태그</text><rect x="64" y="166" width="436" height="76" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="86" y="216" font-size="30" font-weight="400" fill="#7b8798">태그를 입력하세요</text><text x="64" y="312" font-size="30" font-weight="400" fill="#536074">내 태그가 뭐였지?</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">재인: 보고 골라요</text><rect x="552" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="144" font-size="30" font-weight="600" fill="#18243f">저장된 계정</text><rect x="580" y="166" width="436" height="62" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><circle cx="614" cy="197" r="13" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="642" y="208" font-size="28" font-weight="600" fill="#18243f">달빛궁수#KR1</text><rect x="580" y="238" width="436" height="62" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><circle cx="614" cy="269" r="13" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="642" y="280" font-size="28" font-weight="400" fill="#18243f">새벽정글#1234</text><rect x="580" y="310" width="436" height="62" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><circle cx="614" cy="341" r="13" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="642" y="352" font-size="28" font-weight="400" fill="#18243f">늦은밤#2222</text><text 