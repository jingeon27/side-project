<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">게임 필터의 표현</title><desc id="desc">선택하지 않은 필터의 모양이 제각각인 경우와 같은 규칙으로 맞춘 경우의 비교.</desc><rect width="1080" height="400" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">모두 선택 전인데 제각각</text><rect x="36" y="84" width="492" height="280" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="64" y="116" width="204" height="70" rx="10" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="2"/><text x="166" y="162" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">발로란트</text><rect x="296" y="116" width="204" height="70" rx="2" fill="#f2f5fa" stroke="#8d99ab" stroke-width="2" stroke-dasharray="8 6"/><text x="398" y="162" font-size="30" font-weight="600" fill="#536074" text-anchor="middle">롤</text><rect x="64" y="208" width="204" height="70" rx="35" fill="#fff" stroke="#a85b20" stroke-width="2"/><text x="166" y="254" font-size="30" font-weight="600" fill="#a85b20" text-anchor="middle">오버워치</text><rect x="296" y="208" width="204" height="70" rx="22" fill="#22704f" stroke="#22704f" stroke-width="2"/><text x="398" y="254" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">철권</text><text x="64" y="328" font-size="30" font-weight="400" fill="#536074">무엇이 선택됐는지 헷갈려요</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">같은 표현, 선택만 구분</text><rect x="552" y="84" width="492" height="280" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="580" y="116" width="204" height="70" rx="35" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="682" y="162" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">발로란트</text><rect x="812" y="116" width="204" height="70" rx="35" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="914" y="162" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">롤</text><rect x="580" y="208" width="204" height="70" rx="35" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="682" y="254" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">오버워치</text><rect x="812" y="208" width="204" height="70" rx="35" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="914" y="254" font-size="30" font-weight="600" fill="#18243f" text-anchor="middle">철권</text><text x="580" y="328" font-size="30" font-weight="600" fill="#a85b20">발로란트만 선택했어요</text></g></svg>
