<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc"><title id="title">스위치와 조명의 대응</title><desc id="desc">스위치와 조명의 연결이 엇갈린 배치와 위치가 대응하는 배치의 비교.</desc><rect width="1080" height="490" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">연결이 엇갈렸어요</text><rect x="36" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><line x1="132" y1="310" x2="432" y2="200" stroke="#a85b20" stroke-width="4"/><line x1="282" y1="310" x2="132" y2="200" stroke="#a5b1c3" stroke-width="2"/><line x1="432" y1="310" x2="282" y2="200" stroke="#a5b1c3" stroke-width="2"/><circle cx="132" cy="160" r="40" fill="#fff" stroke="#a5b1c3" stroke-width="3"/><circle cx="282" cy="160" r="40" fill="#fff" stroke="#a5b1c3" stroke-width="3"/><circle cx="432" cy="160" r="40" fill="#fff3e7" stroke="#a85b20" stroke-width="3"/><rect x="104" y="310" width="56" height="64" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><rect x="254" y="310" width="56" height="64" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="404" y="310" width="56" height="64" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="424" font-size="30" font-weight="400" fill="#536074">한 번 더 확인해야 해요</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">위치가 대응해요</text><rect x="552" y="84" width="492" height="370" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><line x1="648" y1="310" x2="648" y2="200" stroke="#a85b20" stroke-width="4"/><line x1="798" y1="310" x2="798" y2="200" stroke="#a5b1c3" stroke-width="2"/><line x1="948" y1="310" x2="948" y2="200" stroke="#a5b1c3" stroke-width="2"/><circle cx="648" cy="160" r="40" fill="#fff3e7" stroke="#a85b20" stroke-width="3"/><circle cx="798" cy="160" r="40" fill="#fff" stroke="#a5b1c3" stroke-width="3"/><circle cx="948" cy="160" r="40" fill="#fff" stroke="#a5b1c3" stroke-width="3"/><rect x="620" y="310" width="56" height="64" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><rect x="770" y="310" width="56" height="64" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="920" y="310" width="56" height="64" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="424" font-size="30" font-weight="600" fill="#a85b20">어느 조명인지 예상돼요</text></g></svg>
