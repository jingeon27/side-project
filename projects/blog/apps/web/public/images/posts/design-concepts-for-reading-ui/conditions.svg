<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">소개와 조건을 강조하는 코칭 카드</title><desc id="desc">같은 코칭 내용에서 설명과 이용 조건의 우선순위를 바꾼 두 카드.</desc><rect width="1080" height="640" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">코칭 설명부터 읽기</text><rect x="36" y="84" width="492" height="520" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="146" font-size="38" font-weight="700" fill="#18243f">리플레이 코칭</text><text x="64" y="202" font-size="30" font-weight="400" fill="#536074">리플레이를 함께 보며</text><text x="64" y="242" font-size="30" font-weight="400" fill="#536074">다음 경기에서 고칠</text><text x="64" y="282" font-size="30" font-weight="400" fill="#536074">점을 찾아요.</text><text x="64" y="350" font-size="30" font-weight="400" fill="#18243f">1회 30분</text><text x="64" y="394" font-size="30" font-weight="400" fill="#18243f">평일 저녁</text><text x="64" y="466" font-size="30" font-weight="400" fill="#536074">회당 30,000원</text><rect x="64" y="504" width="436" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="282" y="551" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">문의하기</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">이용 조건부터 확인하기</text><rect x="552" y="84" width="492" height="520" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="150" font-size="40" font-weight="800" fill="#18243f">회당 30,000원</text><text x="580" y="206" font-size="32" font-weight="600" fill="#18243f">리플레이 코칭</text><rect x="580" y="230" width="436" height="112" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="600" y="276" font-size="30" font-weight="400" fill="#18243f">1회 30분</text><text x="600" y="320" font-size="30" font-weight="400" fill="#18243f">평일 저녁</text><text x="580" y="390" font-size="30" font-weight="400" fill="#536074">리플레이를 함께 보며</text><text x="580" y="430" font-size="30" font-weight="400" fill="#536074">다음 경기에서 고칠</text><text x="580" y="470" font-size="30" font-weight="400" fill="#536074">점을 찾아요.</text><rect x="580" y="504" width="436" height="72" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="798" y="551" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">문의하기</text></g></svg>
