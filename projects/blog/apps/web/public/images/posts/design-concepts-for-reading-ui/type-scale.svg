<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">역할별 글자 크기 규칙</title><desc id="desc">화면마다 따로 고른 글자 크기와 역할별 토큰으로 정한 크기의 비교. 크기는 예시입니다.</desc><rect width="1080" height="540" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">화면마다 따로 골랐어요</text><rect x="36" y="84" width="492" height="420" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="150" font-size="42" font-weight="700" fill="#18243f">제목 21px</text><text x="64" y="226" font-size="34" font-weight="400" fill="#18243f">본문 17px</text><text x="64" y="302" font-size="46" font-weight="600" fill="#18243f">다른 제목 23px</text><text x="64" y="378" font-size="30" font-weight="500" fill="#18243f">레이블 15px</text><text x="64" y="454" font-size="38" font-weight="400" fill="#18243f">다른 본문 19px</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">역할별 규칙을 정했어요</text><rect x="552" y="84" width="492" height="420" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="168" font-size="48" font-weight="700" fill="#18243f">제목</text><text x="1016" y="168" font-size="26" font-weight="400" fill="#a85b20" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">text.title</text><text x="580" y="260" font-size="34" font-weight="400" fill="#18243f">본문</text><text x="1016" y="260" font-size="26" font-weight="400" fill="#a85b20" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">text.body</text><text x="580" y="352" font-size="30" font-weight="600" fill="#18243f">레이블</text><text x="1016" y="352" font-size="26" font-weight="400" fill="#a85b20" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">text.label</text><text x="580" y="444" font-size="28" font-weight="400" fill="#536074">보조 정보</text><text x="1016" y="444" font-size="26" font-weight="400" fill="#a85b20" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">text.caption</text></g></svg>
