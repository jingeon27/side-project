<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">Cues on a sort control</title><desc id="desc">A plain text sort label compared with a sort control that has a border and an arrow.</desc><rect width="1080" height="380" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Text only</text><rect x="36" y="84" width="492" height="260" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="159" font-size="30" font-weight="400" fill="#18243f">Lowest price</text><rect x="64" y="212" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="64" y="246" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><text x="64" y="312" font-size="30" font-weight="400" fill="#536074">Reads like a status label</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Border and arrow added</text><rect x="552" y="84" width="492" height="260" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="580" y="112" width="304" height="72" rx="10" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="602" y="159" font-size="30" font-weight="600" fill="#18243f">Lowest price</text><path d="M838 142l10 11 10-11" fill="none" stroke="#18243f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="580" y="212" width="436" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><rect x="580" y="246" width="372" height="18" rx="9" fill="#e3e8f0" stroke="none" stroke-width="0"/><text x="580" y="312" font-size="30" font-weight="600" fill="#a85b20">Looks like you can change it</text></g></svg>
