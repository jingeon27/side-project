<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc"><title id="title">작업에 맞는 정보 밀도</title><desc id="desc">같은 코칭 목록을 여유 있는 카드와 촘촘한 표로 표현한 비교.</desc><rect width="1080" height="550" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#a85b20">하나씩 읽을 때는 카드</text><rect x="36" y="84" width="492" height="205" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="140" font-size="34" font-weight="700" fill="#18243f">리플레이 코칭</text><text x="64" y="192" font-size="28" font-weight="400" fill="#536074">함께 보며 고칠 점을 찾아요</text><text x="64" y="252" font-size="30" font-weight="600" fill="#18243f">30분, 30,000원</text><rect x="36" y="309" width="492" height="205" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="365" font-size="34" font-weight="700" fill="#18243f">라인전 코칭</text><text x="64" y="417" font-size="28" font-weight="400" fill="#536074">라인 운영을 하나씩 짚어요</text><text x="64" y="477" font-size="30" font-weight="600" fill="#18243f">60분, 50,000원</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">비교할 때는 표</text><rect x="552" y="84" width="492" height="430" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="576" y="134" font-size="28" font-weight="700" fill="#536074">코칭</text><text x="752" y="134" font-size="28" font-weight="700" fill="#536074">시간</text><text x="1020" y="134" font-size="28" font-weight="700" fill="#536074" text-anchor="end">가격</text><line x1="552" y1="156" x2="1044" y2="156" stroke="#a5b1c3" stroke-width="2"/><text x="576" y="204" font-size="30" font-weight="600" fill="#18243f">리플레이</text><text x="752" y="204" font-size="30" font-weight="400" fill="#18243f">30분</text><text x="1020" y="204" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">30,000원</text><line x1="564" y1="230" x2="1032" y2="230" stroke="#e3e8f0" stroke-width="2"/><text x="576" y="276" font-size="30" font-weight="600" fill="#18243f">라인전</text><text x="752" y="276" font-size="30" font-weight="400" fill="#18243f">60분</text><text x="1020" y="276" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">50,000원</text><line x1="564" y1="302" x2="1032" y2="302" stroke="#e3e8f0" stroke-width="2"/><text x="576" y="348" font-size="30" font-weight="600" fill="#18243f">에임</text><text x="752" y="348" font-size="30" font-weight="400" fill="#18243f">30분</text><text x="1020" y="348" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">9,000원</text><line x1="564" y1="374" x2="1032" y2="374" stroke="#e3e8f0" stroke-width="2"/><text x="576" y="420" font-size="30" font-weight="600" fill="#18243f">운영</text><text x="752" y="420" font-size="30" font-weight="400" fill="#18243f">90분</text><text x="1020" y="420" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">70,000원</text></g></svg>
