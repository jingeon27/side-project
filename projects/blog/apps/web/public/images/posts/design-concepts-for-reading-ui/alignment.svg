<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc"><title id="title">코칭 목록의 정렬</title><desc id="desc">이름과 시간, 가격의 위치가 제각각인 목록과 기준선을 맞춘 목록의 비교.</desc><rect width="1080" height="450" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">값의 위치가 제각각이에요</text><rect x="36" y="84" width="492" height="330" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="164" font-size="30" font-weight="600" fill="#18243f">리플레이</text><text x="236" y="164" font-size="30" font-weight="400" fill="#536074">30분</text><text x="366" y="164" font-size="30" font-weight="700" fill="#18243f">30,000원</text><line x1="56" y1="198" x2="508" y2="198" stroke="#e3e8f0" stroke-width="2"/><text x="100" y="256" font-size="30" font-weight="600" fill="#18243f">라인전</text><text x="206" y="256" font-size="30" font-weight="400" fill="#536074">60분</text><text x="316" y="256" font-size="30" font-weight="700" fill="#18243f">50,000원</text><line x1="56" y1="290" x2="508" y2="290" stroke="#e3e8f0" stroke-width="2"/><text x="74" y="348" font-size="30" font-weight="600" fill="#18243f">에임</text><text x="186" y="348" font-size="30" font-weight="400" fill="#536074">30분</text><text x="346" y="348" font-size="30" font-weight="700" fill="#18243f">9,000원</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">기준선을 맞췄어요</text><rect x="552" y="84" width="492" height="330" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><line x1="572" y1="108" x2="572" y2="390" stroke="#d8a572" stroke-width="2" stroke-dasharray="8 8"/><line x1="740" y1="108" x2="740" y2="390" stroke="#d8a572" stroke-width="2" stroke-dasharray="8 8"/><line x1="1024" y1="108" x2="1024" y2="390" stroke="#d8a572" stroke-width="2" stroke-dasharray="8 8"/><text x="580" y="164" font-size="30" font-weight="600" fill="#18243f">리플레이</text><text x="748" y="164" font-size="30" font-weight="400" fill="#536074">30분</text><text x="1016" y="164" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">30,000원</text><line x1="572" y1="198" x2="1024" y2="198" stroke="#e3e8f0" stroke-width="2"/><text x="580" y="256" font-size="30" font-weight="600" fill="#18243f">라인전</text><text x="748" y="256" font-size="30" font-weight="400" fill="#536074">60분</text><text x="1016" y="256" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">50,000원</text><line x1="572" y1="290" x2="1024" y2="290" stroke="#e3e8f0" stroke-width="2"/><text x="580" y="348" font-size="30" font-weight="600" fill="#18243f">에임</text><text x="748" y="348" font-size="30" font-weight="400" fill="#536074">30분</text><text x="1016" y="348" font-size="30" font-weight="700" fill="#18243f" text-anchor="end">9,000원</text></g></svg>
