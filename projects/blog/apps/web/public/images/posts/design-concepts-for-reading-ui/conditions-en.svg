<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">Coaching cards with different emphasis</title><desc id="desc">The same coaching offer, with either the description or the booking conditions given priority.</desc><rect width="1080" height="640" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">Description first</text><rect x="36" y="84" width="492" height="520" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="64" y="146" font-size="38" font-weight="700" fill="#18243f">Replay coaching</text><text x="64" y="202" font-size="30" font-weight="400" fill="#536074">Review your replay together</text><text x="64" y="242" font-size="30" font-weight="400" fill="#536074">and find what to fix</text><text x="64" y="282" font-size="30" font-weight="400" fill="#536074">in your next match.</text><text x="64" y="350" font-size="30" font-weight="400" fill="#18243f">30 min per session</text><text x="64" y="394" font-size="30" font-weight="400" fill="#18243f">Weekday evenings</text><text x="64" y="466" font-size="30" font-weight="400" fill="#536074">₩30,000 per session</text><rect x="64" y="504" width="436" height="72" rx="10" fill="#334660" stroke="#334660" stroke-width="2"/><text x="282" y="551" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Ask a question</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">Conditions first</text><rect x="552" y="84" width="492" height="520" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><text x="580" y="150" font-size="40" font-weight="800" fill="#18243f">₩30,000 per session</text><text x="580" y="206" font-size="32" font-weight="600" fill="#18243f">Replay coaching</text><rect x="580" y="230" width="436" height="112" rx="10" fill="#fff3e7" stroke="#d8a572" stroke-width="2"/><text x="600" y="276" font-size="30" font-weight="400" fill="#18243f">30 min per session</text><text x="600" y="320" font-size="30" font-weight="400" fill="#18243f">Weekday evenings</text><text x="580" y="390" font-size="30" font-weight="400" fill="#536074">Review your replay together</text><text x="580" y="430" font-size="30" font-weight="400" fill="#536074">and find what to fix</text><text x="580" y="470" font-size="30" font-weight="400" fill="#536074">in your next match.</text><rect x="580" y="504" width="436" height="72" rx="10" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="798" y="551" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Ask a question</text></g></svg>
