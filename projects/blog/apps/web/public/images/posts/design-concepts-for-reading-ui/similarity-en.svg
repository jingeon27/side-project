<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">Game filter styles</title><desc id="desc">Unselected filters with unrelated styles compared with filters that share one rule.</desc><rect width="1080" height="400" fill="#f2f5fa"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Arial,sans-serif"><text x="36" y="56" font-size="34" font-weight="700" fill="#536074">None selected, all different</text><rect x="36" y="84" width="492" height="280" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="64" y="116" width="204" height="70" rx="10" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="2"/><text x="166" y="162" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Valorant</text><rect x="296" y="116" width="204" height="70" rx="2" fill="#f2f5fa" stroke="#8d99ab" stroke-width="2" stroke-dasharray="8 6"/><text x="398" y="162" font-size="30" font-weight="600" fill="#536074" text-anchor="middle">LoL</text><rect x="64" y="208" width="204" height="70" rx="35" fill="#fff" stroke="#a85b20" stroke-width="2"/><text x="166" y="254" font-size="30" font-weight="600" fill="#a85b20" text-anchor="middle">Overwatch</text><rect x="296" y="208" width="204" height="70" rx="22" fill="#22704f" stroke="#22704f" stroke-width="2"/><text x="398" y="254" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Tekken</text><text x="64" y="328" font-size="30" font-weight="400" fill="#536074">Which one is selected?</text><text x="552" y="56" font-size="34" font-weight="700" fill="#a85b20">One style, clear selection</text><rect x="552" y="84" width="492" height="280" rx="18" fill="#fff" stroke="#a5b1c3" stroke-width="2"/><rect x="580" y="116" width="204" height="70" rx="35" fill="#a85b20" stroke="#a85b20" stroke-width="2"/><text x="682" y="162" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">Valorant</text><rect x="812" y="