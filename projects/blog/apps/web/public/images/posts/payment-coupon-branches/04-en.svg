<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1346" viewBox="0 0 1080 1346"><title>Group payment branches by saved state</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1346" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Group payment branches by saved state</tspan></text><rect x="68" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">First implementation</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Coupon support added another</tspan><tspan x="96" dy="38">case to a renderer that already</tspan><tspan x="96" dy="38">mixed method, status, and saved</tspan><tspan x="96" dy="38">state. Several separate if</tspan><tspan x="96" dy="38">branches repeated those</tspan><tspan x="96" dy="38">decisions.</tspan></text><rect x="552" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Extract and classify</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Move each details component</tspan><tspan x="580" dy="38">into its own file. Use a match</tspan><tspan x="580" dy="38">expression to make the possible</tspan><tspan x="580" dy="38">outcomes explicit instead of</tspan><tspan x="580" dy="38">lengthening the original renderer.</tspan></text><rect x="68" y="520" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Unsaved rows first</tspan></text><text x="96" y="639" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">If the value is missing or has no</tspan><tspan x="96" dy="38">ID, inspect the payment method:</tspan><tspan x="96" dy="38">render the coupon editor for a</tspan><tspan x="96" dy="38">coupon row and the waiting editor</tspan><tspan x="96" dy="38">for the other editable row.</tspan></text><rect x="552" y="520" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Saved rows next</tspan></text><text x="580" y="639" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">For saved records, choose</tspan><tspan x="580" dy="38">cancellation, completed payment,</tspan><tspan x="580" dy="38">or the remaining waiting case.</tspan><tspan x="580" dy="38">Status cannot turn an unsaved</tspan><tspan x="580" dy="38">input row into a saved details</tspan><tspan x="580" dy="38">view.</tspan></text><rect x="68" y="880" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="928" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Other affected places</tspan></text><text x="96" y="999" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Update the form model, visibility</tspan><tspan x="96" dy="38">helper, header, dot color, details</tspan><tspan x="96" dy="38">renderer, and request conversion</tspan><tspan x="96" dy="38">together. These decisions remain</tspan><tspan x="96" dy="38">separate even when they</tspan><tspan x="96" dy="38">concern the same row.</tspan></text><text x="68" y="1271" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1308" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
