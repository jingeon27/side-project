<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1904" viewBox="0 0 1080 1904"><title>Five decisions for one payment row</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1904" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Five decisions for one payment row</tspan></text><rect x="68" y="160" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Timeline visibility</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">isVisiblePaymentHistory checks method and status, and checks the</tspan><tspan x="96" dy="41">ID for coupon payments. Hidden records do not receive a timeline</tspan><tspan x="96" dy="41">number.</tspan></text><path d="M540 400 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="433" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="481" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Dot color</tspan></text><text x="96" y="552" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">getPaymentHistoryColor marks completed on-site payments green</tspan><tspan x="96" dy="41">and completed on-site cancellations red. The other displayed rows</tspan><tspan x="96" dy="41">stay gray.</tspan></text><path d="M540 673 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="706" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="754" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Header</tspan></text><text x="96" y="825" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">PaymentHistoryHeader chooses the payment, cancellation, or</tspan><tspan x="96" dy="41">input-prompt tag, date, and amount from method and status.</tspan></text><path d="M540 905 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="938" width="944" height="190" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="986" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Initial expansion</tspan></text><text x="96" y="1057" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">PaymentHistory initially opens a row whose payment status is not</tspan><tspan x="96" dy="41">completed. This decision is separate from the details renderer.</tspan></text><path d="M540 1137 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1170" width="944" height="272" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1218" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">5. Details component</tspan></text><text x="96" y="1289" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">PaymentHistoryDescriptions checks saved state first, then</tspan><tspan x="96" dy="41">cancellation and completion. An unsaved coupon uses</tspan><tspan x="96" dy="41">CouponDescriptions; a pending editable row uses</tspan><tspan x="96" dy="41">WaitingDescriptions.</tspan></text><path d="M540 1451 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1484" width="944" height="272" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1532" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Saved and hidden cases</tspan></text><text x="96" y="1603" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Saved completed payments use CompletedDescriptions; completed</tspan><tspan x="96" dy="41">cancellations use CanceledDescriptions. Saved coupon rows are</tspan><tspan x="96" dy="41">shown through the linked on-site payment rather than as another</tspan><tspan x="96" dy="41">timeline entry.</tspan></text><text x="68" y="1829" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1866" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
