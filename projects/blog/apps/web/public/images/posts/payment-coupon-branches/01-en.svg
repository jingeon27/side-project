<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1434" viewBox="0 0 1080 1434"><title>Rows in one payment form array</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1434" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Rows in one payment form array</tspan></text><rect x="68" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Persisted server rows</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The shared response interface</tspan><tspan x="96" dy="38">describes saved payments, with</tspan><tspan x="96" dy="38">an ID, payment method, status,</tspan><tspan x="96" dy="38">date, amount, and balance.</tspan><tspan x="96" dy="38">Cancelling adds a cancellation</tspan><tspan x="96" dy="38">row rather than rewriting the</tspan><tspan x="96" dy="38">original payment.</tspan></text><rect x="552" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">A pending row created by</tspan><tspan x="580" dy="44">the UI</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Settlement details append a</tspan><tspan x="580" dy="38">pending on-site payment or</tspan><tspan x="580" dy="38">cancellation row when no such</tspan><tspan x="580" dy="38">row exists. It has no saved ID</tspan><tspan x="580" dy="38">and provides the editable</tspan><tspan x="580" dy="38">payment fields.</tspan></text><rect x="68" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">A coupon row created by</tspan><tspan x="96" dy="44">the UI</tspan></text><text x="96" y="727" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Before reservation confirmation,</tspan><tspan x="96" dy="38">the screen creates an unsaved</tspan><tspan x="96" dy="38">coupon-payment row. The</tspan><tspan x="96" dy="38">coupon discount amount is the</tspan><tspan x="96" dy="38">extra field absent from the</tspan><tspan x="96" dy="38">payment DTO.</tspan></text><rect x="552" y="564" width="460" height="380" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">The shared form model</tspan></text><text x="580" y="683" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The form array contains both</tspan><tspan x="580" dy="38">server records and temporary</tspan><tspan x="580" dy="38">rows. Its type extends the server</tspan><tspan x="580" dy="38">shape only with fields the editor</tspan><tspan x="580" dy="38">needs.</tspan></text><rect x="68" y="968" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1016" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Two request paths</tspan></text><text x="96" y="1087" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Settlement submits the required</tspan><tspan x="96" dy="38">payment fields. Reservation</tspan><tspan x="96" dy="38">confirmation selects the coupon</tspan><tspan x="96" dy="38">fields required by its request</tspan><tspan x="96" dy="38">rather than sending the entire</tspan><tspan x="96" dy="38">editing model.</tspan></text><text x="68" y="1359" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1396" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
