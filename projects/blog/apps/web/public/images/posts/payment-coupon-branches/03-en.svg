<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1434" viewBox="0 0 1080 1434"><title>Coupon edits before confirmation</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1434" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Coupon edits before confirmation</tspan></text><rect x="68" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Before confirmation</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The editable coupon row contains</tspan><tspan x="96" dy="38">a payment date, the applied</tspan><tspan x="96" dy="38">coupon amount, the expected</tspan><tspan x="96" dy="38">total, and the final amount. Other</tspan><tspan x="96" dy="38">form fields supply the quote, visit</tspan><tspan x="96" dy="38">date, and memo.</tspan></text><rect x="552" y="160" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">When the expected total</tspan><tspan x="580" dy="44">changes</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Form.Item writes the new amount</tspan><tspan x="580" dy="38">to the form. The change handler</tspan><tspan x="580" dy="38">immediately clears the applied</tspan><tspan x="580" dy="38">coupon and displays a notice so</tspan><tspan x="580" dy="38">an outdated discount cannot</tspan><tspan x="580" dy="38">remain attached.</tspan></text><rect x="68" y="564" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Choose the coupon again</tspan></text><text x="96" y="683" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The user can review the revised</tspan><tspan x="96" dy="38">amount and select an eligible</tspan><tspan x="96" dy="38">coupon again before confirming</tspan><tspan x="96" dy="38">the reservation.</tspan></text><rect x="552" y="564" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="612" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">After confirmation</tspan></text><text x="580" y="683" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Completion details find the linked</tspan><tspan x="580" dy="38">coupon-payment row and put the</tspan><tspan x="580" dy="38">coupon amount in the</tspan><tspan x="580" dy="38">corresponding display field. The</tspan><tspan x="580" dy="38">final amount includes that linked</tspan><tspan x="580" dy="38">coupon amount.</tspan></text><rect x="68" y="924" width="460" height="380" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="972" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep request fields</tspan><tspan x="96" dy="44">explicit</tspan></text><text x="96" y="1087" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Confirmation extracts the fields</tspan><tspan x="96" dy="38">required by its request. The</tspan><tspan x="96" dy="38">form&apos;s temporary editing state</tspan><tspan x="96" dy="38">and extra coupon field are not a</tspan><tspan x="96" dy="38">replacement for the server</tspan><tspan x="96" dy="38">contract.</tspan></text><text x="68" y="1359" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1396" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
