<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1590" viewBox="0 0 1080 1590"><title>Treatment selection across three versions</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1590" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Treatment selection across three versions</tspan></text><rect x="68" y="160" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Keyword autocomplete</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The original dropdown adds treatment keywords to the review&apos;s</tspan><tspan x="96" dy="41">details step. The form keeps the selected items.</tspan></text><path d="M540 359 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="392" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="440" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Multi-select dropdown</tspan></text><text x="96" y="511" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The second refactor adds multiple selection inside the dropdown.</tspan><tspan x="96" dy="41">The stored field shape and the one-to-five, no-duplicates schema</tspan><tspan x="96" dy="41">rule remain the same.</tspan></text><path d="M540 632 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="665" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="713" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Bottom Sheet</tspan></text><text x="96" y="784" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The design-system version opens a sheet with a separate temporary</tspan><tspan x="96" dy="41">selection. Tapping items changes that draft instead of immediately</tspan><tspan x="96" dy="41">changing the form.</tspan></text><path d="M540 905 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="938" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="986" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Confirm or close</tspan></text><text x="96" y="1057" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Confirmation replaces the form field with the completed selection.</tspan><tspan x="96" dy="41">Closing without confirmation sends nothing back, so the form keeps</tspan><tspan x="96" dy="41">its opening value.</tspan></text><path d="M540 1178 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1211" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1259" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep the contract separate from the picker</tspan></text><text x="96" y="1330" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The step schema validates the same item array. The interaction can</tspan><tspan x="96" dy="41">change without making the picker another owner of the submitted</tspan><tspan x="96" dy="41">form values.</tspan></text><text x="68" y="1515" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1552" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
