<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1156" viewBox="0 0 1080 1156"><title>Temporary selection until confirmation</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1156" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Temporary selection until confirmation</tspan></text><rect x="68" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Open the field</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">ItemsField reads the details</tspan><tspan x="96" dy="38">step&apos;s items through</tspan><tspan x="96" dy="38">useFieldArray. The sheet</tspan><tspan x="96" dy="38">receives the opening values and</tspan><tspan x="96" dy="38">uses them to initialize draft.</tspan></text><rect x="552" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Choose inside the sheet</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Tapping a result toggles the draft</tspan><tspan x="580" dy="38">selection. Search, the checklist,</tspan><tspan x="580" dy="38">the selection summary, and</tspan><tspan x="580" dy="38">Reset operate on that temporary</tspan><tspan x="580" dy="38">value.</tspan></text><rect x="68" y="482" width="460" height="260" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Confirm</tspan></text><text x="96" y="601" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Pass the draft back once and call</tspan><tspan x="96" dy="38">replace to update the form array.</tspan><tspan x="96" dy="38">The step then revalidates the</tspan><tspan x="96" dy="38">required count and duplicate rule.</tspan></text><rect x="552" y="482" width="460" height="260" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Close</tspan></text><text x="580" y="601" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Dismiss the sheet without</tspan><tspan x="580" dy="38">passing a value back. The form&apos;s</tspan><tspan x="580" dy="38">original items remain unchanged.</tspan></text><rect x="68" y="766" width="460" height="260" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="814" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Remove a selected item</tspan></text><text x="96" y="885" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The field can use remove for a</tspan><tspan x="96" dy="38">chip already stored in the form.</tspan><tspan x="96" dy="38">That direct edit is distinct from the</tspan><tspan x="96" dy="38">sheet&apos;s unconfirmed draft.</tspan></text><text x="68" y="1081" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1118" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
