<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="970" viewBox="0 0 1080 970">
  <title>제가 한 순서와 다시 한다면 택할 순서</title>
  <desc>같은 프로젝트를 두 번 만들어 비교한 결과는 아니에요. 제 추측을 정리한 도해예요.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6a7873" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a85f43" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <rect width="1080" height="970" fill="#f4f1ea"/>
  <text x="68" y="62" font-size="24" font-weight="400" fill="#62756d" text-anchor="start">02 / 작업 순서</text>
  <text x="68" y="124" font-size="40" font-weight="700" fill="#273b36" text-anchor="start">제가 한 순서와 다시 한다면 택할 순서</text>
  <rect x="96" y="148" width="230" height="50" rx="10" fill="#f5e6df"/><text x="116" y="183" font-size="28" font-weight="700" fill="#9c5238" text-anchor="start">제가 한 순서</text>
  <rect x="582" y="148" width="230" height="50" rx="10" fill="#e4ece0"/><text x="602" y="183" font-size="28" font-weight="700" fill="#2f5a48" text-anchor="start">다시 한다면</text>
  <rect x="96" y="214" width="430" height="104" rx="14" fill="#fffef9" stroke="#d9bfb3" stroke-width="2"/><text x="122" y="256" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">기술 스택, 요구사항,</text><text x="122" y="296" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">캐싱 정책 정하기</text>
  <path d="M 311.0 322 V 344" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="348" width="430" height="104" rx="14" fill="#fffef9" stroke="#d9bfb3" stroke-width="2"/><text x="122" y="390" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">세부 조건과 디자인까지</text><text x="122" y="430" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">에이전트에게 맡기기</text>
  <path d="M 311.0 456 V 478" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="482" width="430" height="104" rx="14" fill="#fffef9" stroke="#d9bfb3" stroke-width="2"/><text x="122" y="524" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">결과 보고를 받고</text><text x="122" y="564" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">화면을 써 보기</text>
  <path d="M 311.0 590 V 612" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="616" width="430" height="104" rx="14" fill="#fffef9" stroke="#d9bfb3" stroke-width="2"/><text x="122" y="658" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">빠진 케이스와 기술 부채를</text><text x="122" y="698" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">따로 정리하기</text>
  <path d="M 311.0 724 V 746" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="750" width="430" height="104" rx="14" fill="#fffef9" stroke="#d9bfb3" stroke-width="2"/><text x="122" y="792" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">케이스를 채워 넣고</text><text x="122" y="832" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">코드 구조도 손보기</text>
  <rect x="582" y="214" width="430" height="104" rx="14" fill="#fffef9" stroke="#9db7a5" stroke-width="2"/><text x="608" y="276" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">작업 시스템 먼저 갖추기</text>
  <path d="M 797.0 322 V 344" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="348" width="430" height="104" rx="14" fill="#fffef9" stroke="#9db7a5" stroke-width="2"/><text x="608" y="410" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">케이스마다 조건 정하기</text>
  <path d="M 797.0 456 V 478" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="482" width="430" height="104" rx="14" fill="#fffef9" stroke="#9db7a5" stroke-width="2"/><text x="608" y="544" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">HTML로 디자인 기준 잡기</text>
  <path d="M 797.0 590 V 612" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="616" width="430" height="104" rx="14" fill="#fffef9" stroke="#9db7a5" stroke-width="2"/><text x="608" y="678" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">구현을 에이전트에게 맡기기</text>
  <path d="M 797.0 724 V 746" fill="none" stroke="#6a7873" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="750" width="430" height="104" rx="14" fill="#fffef9" stroke="#9db7a5" stroke-width="2"/><text x="608" y="812" font-size="30" font-weight="400" fill="#273b36" text-anchor="start">미리 정한 기준으로 검증하기</text>
  <path d="M 92 802.0 H 58 V 534.0 H 88" fill="none" stroke="#a85f43" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)"/>
  <path d="M 68 898 H 1012" stroke="#c8ccc2" stroke-width="2"/>
  <text x="68" y="942" font-size="24" font-weight="400" fill="#7d8a84" text-anchor="start">같은 프로젝트를 두 번 만들어 비교한 결과는 아니에요. 제 추측을 정리한 도해예요.</text>
  </g>
</svg>
