<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1549" viewBox="0 0 1080 1549"><title>Copy the common schedule into the form</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1549" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Copy the common schedule into the form</tspan></text><rect x="68" y="160" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Read server-supplied people</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Member and family queries identify the available participants. They</tspan><tspan x="96" dy="41">do not own the preferred appointment time entered on this screen.</tspan></text><path d="M540 359 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="392" width="944" height="190" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="440" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Choose the common date and time</tspan></text><text x="96" y="511" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The visitor selects a common preferred schedule. The form writes it</tspan><tspan x="96" dy="41">to preferredDate and preferredTime.</tspan></text><path d="M540 591 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="624" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="672" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Copy to the participant array</tspan></text><text x="96" y="743" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Apply the same date and time to each participant entry in the form.</tspan><tspan x="96" dy="41">Participant edits and the common values now share the same</tspan><tspan x="96" dy="41">FormProvider.</tspan></text><path d="M540 864 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="897" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="945" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Validate the application</tspan></text><text x="96" y="1016" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Require the necessary participant and schedule fields, at least one</tspan><tspan x="96" dy="41">selected person, and the request-note limits before enabling</tspan><tspan x="96" dy="41">submission.</tspan></text><path d="M540 1137 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1170" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1218" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Keep conversion at the boundary</tspan></text><text x="96" y="1289" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Submitting converts the form&apos;s values into the request shape. The</tspan><tspan x="96" dy="41">display does not need a second store or a query-cache update to</tspan><tspan x="96" dy="41">retain those edits.</tspan></text><text x="68" y="1474" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1511" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
