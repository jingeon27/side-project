<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1358" viewBox="0 0 1080 1358"><title>Four participant synchronization cases</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1358" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Four participant synchronization cases</tspan></text><rect x="68" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Empty form array</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Populate from the complete</tspan><tspan x="96" dy="38">server list. Use the list&apos;s default</tspan><tspan x="96" dy="38">selection and the form&apos;s common</tspan><tspan x="96" dy="38">preferred date/time, or empty</tspan><tspan x="96" dy="38">values if no schedule has been</tspan><tspan x="96" dy="38">chosen.</tspan></text><rect x="552" y="160" width="460" height="342" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Server list becomes</tspan><tspan x="580" dy="44">shorter</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Retain the form entries whose</tspan><tspan x="580" dy="38">memberId still exists on the</tspan><tspan x="580" dy="38">server. Their selection and</tspan><tspan x="580" dy="38">preferred schedule remain</tspan><tspan x="580" dy="38">unchanged.</tspan></text><rect x="68" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Server list becomes</tspan><tspan x="96" dy="44">longer</tspan></text><text x="96" y="689" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Keep existing form entries and</tspan><tspan x="96" dy="38">append the missing people. New</tspan><tspan x="96" dy="38">entries start selected and receive</tspan><tspan x="96" dy="38">the form&apos;s common preferred</tspan><tspan x="96" dy="38">date/time.</tspan></text><rect x="552" y="526" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="574" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Same length</tspan></text><text x="580" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Leave the existing form array as</tspan><tspan x="580" dy="38">it is. This branch does not rewrite</tspan><tspan x="580" dy="38">every participant on an ordinary</tspan><tspan x="580" dy="38">query update.</tspan></text><rect x="68" y="892" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="940" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Why memberId matters</tspan></text><text x="96" y="1011" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Array length chooses the</tspan><tspan x="96" dy="38">synchronization operation;</tspan><tspan x="96" dy="38">memberId identifies the people to</tspan><tspan x="96" dy="38">retain or add. The hook must not</tspan><tspan x="96" dy="38">reset surviving edits when</tspan><tspan x="96" dy="38">someone is added or removed.</tspan></text><text x="68" y="1283" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1320" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
