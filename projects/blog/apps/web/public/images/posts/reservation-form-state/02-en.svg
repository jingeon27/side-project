<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1276" viewBox="0 0 1080 1276"><title>After: the form owns the edits</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1276" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">After: the form owns the edits</tspan></text><rect x="68" y="160" width="460" height="304" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Server and query cache</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The API supplies member and</tspan><tspan x="96" dy="38">family information. React Query</tspan><tspan x="96" dy="38">caches those server values; the</tspan><tspan x="96" dy="38">form no longer writes user edits</tspan><tspan x="96" dy="38">back into them.</tspan></text><rect x="552" y="160" width="460" height="304" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">One React Hook Form</tspan><tspan x="580" dy="44">instance</tspan></text><text x="580" y="323" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The reservation form owns</tspan><tspan x="580" dy="38">participant selection, each</tspan><tspan x="580" dy="38">preferred date/time, the common</tspan><tspan x="580" dy="38">date/time, and the request note.</tspan></text><rect x="68" y="488" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="536" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">A synchronization hook</tspan></text><text x="96" y="607" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">When the server participant list</tspan><tspan x="96" dy="38">changes, align the form&apos;s array</tspan><tspan x="96" dy="38">by memberId. Retain existing</tspan><tspan x="96" dy="38">edits for people who remain and</tspan><tspan x="96" dy="38">initialize newly added people.</tspan></text><rect x="552" y="488" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="536" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Validation</tspan></text><text x="580" y="607" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The Zod schema checks the</tspan><tspan x="580" dy="38">completed form values. The</tspan><tspan x="580" dy="38">application action depends on the</tspan><tspan x="580" dy="38">form satisfying those conditions,</tspan><tspan x="580" dy="38">not on agreement between</tspan><tspan x="580" dy="38">separate stores.</tspan></text><rect x="68" y="848" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">A clear lifetime</tspan></text><text x="96" y="967" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The form owns the editing</tspan><tspan x="96" dy="38">session. Query-cache lifetime no</tspan><tspan x="96" dy="38">longer decides how long</tspan><tspan x="96" dy="38">reservation input remains on the</tspan><tspan x="96" dy="38">screen.</tspan></text><text x="68" y="1201" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1238" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
