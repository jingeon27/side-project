<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1308" viewBox="0 0 1080 1308"><title>Before: one edit in several stores</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1308" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Before: one edit in several stores</tspan></text><rect x="68" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">React Query cache</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The participant-list query contains</tspan><tspan x="96" dy="38">the server&apos;s member and family</tspan><tspan x="96" dy="38">data. Edited selection and</tspan><tspan x="96" dy="38">preferred date/time were also</tspan><tspan x="96" dy="38">written into those cached</tspan><tspan x="96" dy="38">participant objects.</tspan></text><rect x="552" y="160" width="460" height="336" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Zustand</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">A second participant list stores</tspan><tspan x="580" dy="38">selection and preferred schedule</tspan><tspan x="580" dy="38">values while the reservation</tspan><tspan x="580" dy="38">screen is open.</tspan></text><rect x="68" y="520" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Component state</tspan></text><text x="96" y="639" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The common preferred date and</tspan><tspan x="96" dy="38">time are also held locally,</tspan><tspan x="96" dy="38">creating another place to keep</tspan><tspan x="96" dy="38">the same edit synchronized.</tspan></text><rect x="552" y="520" width="460" height="336" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="568" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Different lifetimes</tspan></text><text x="580" y="639" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">The query cache survives beyond</tspan><tspan x="580" dy="38">the screen, the store owns</tspan><tspan x="580" dy="38">another lifetime, and local state</tspan><tspan x="580" dy="38">disappears with its component.</tspan><tspan x="580" dy="38">Returning to the form can expose</tspan><tspan x="580" dy="38">those differences.</tspan></text><rect x="68" y="880" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="928" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">The resulting duplication</tspan></text><text x="96" y="999" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Changing a selection or schedule</tspan><tspan x="96" dy="38">requires updating more than one</tspan><tspan x="96" dy="38">owner. Each copy can be</tspan><tspan x="96" dy="38">individually valid while the screen</tspan><tspan x="96" dy="38">as a whole disagrees.</tspan></text><text x="68" y="1233" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1270" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
