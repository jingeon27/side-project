<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1276" viewBox="0 0 1080 1276"><title>Parallel tickets, separate worktrees</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1276" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Parallel tickets, separate worktrees</tspan></text><rect x="68" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">One independent ticket</tspan></text><text x="96" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">One ticket branch, one Git</tspan><tspan x="96" dy="38">worktree, and one agent session.</tspan><tspan x="96" dy="38">The repository&apos;s worktree skill</tspan><tspan x="96" dy="38">creates the checkout and installs</tspan><tspan x="96" dy="38">its dependencies.</tspan></text><rect x="552" y="160" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Independent sessions</tspan></text><text x="580" y="279" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Ticket A and ticket B each go</tspan><tspan x="580" dy="38">through plan review, tests,</tspan><tspan x="580" dy="38">implementation, diff review, push,</tspan><tspan x="580" dy="38">and PR. Files and dependencies</tspan><tspan x="580" dy="38">stay in their own worktrees.</tspan></text><rect x="68" y="482" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Shared machine limits</tspan></text><text x="96" y="601" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Worktrees share the same</tspan><tspan x="96" dy="38">computer. Run large builds and</tspan><tspan x="96" dy="38">browser suites within the CPU</tspan><tspan x="96" dy="38">and memory budget instead of</tspan><tspan x="96" dy="38">launching every heavy check</tspan><tspan x="96" dy="38">together.</tspan></text><rect x="552" y="482" width="460" height="342" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="580" y="530" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">One related structural</tspan><tspan x="580" dy="44">change</tspan></text><text x="580" y="645" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">Keep linked changes to the same</tspan><tspan x="580" dy="38">components and API in one</tspan><tspan x="580" dy="38">session. Review the finished diff</tspan><tspan x="580" dy="38">together, approve it, and request</tspan><tspan x="580" dy="38">revisions in that session.</tspan></text><rect x="68" y="848" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">Where to split work</tspan></text><text x="96" y="967" font-size="27" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Parallelize independent tasks.</tspan><tspan x="96" dy="38">Keep interdependent decisions</tspan><tspan x="96" dy="38">together so two sessions do not</tspan><tspan x="96" dy="38">separately rewrite the same</tspan><tspan x="96" dy="38">structure.</tspan></text><rect x="552" y="848" width="460" height="298" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="580" y="896" font-size="32" font-weight="700" fill="#234969"><tspan x="580" dy="0">Where I review</tspan></text><text x="580" y="967" font-size="27" font-weight="400" fill="#40566b"><tspan x="580" dy="0">I review the plan first and the</tspan><tspan x="580" dy="38">resulting diff and screens</tspan><tspan x="580" dy="38">afterward. The agent runs the</tspan><tspan x="580" dy="38">automated checks before</tspan><tspan x="580" dy="38">pushing.</tspan></text><text x="68" y="1201" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1238" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
