<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1508" viewBox="0 0 1080 1508"><title>Review and checks before push</title><desc>English reconstruction of the original explanatory diagram.</desc><rect width="1080" height="1508" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="68" y="62" font-size="23" font-weight="700" fill="#687d88"><tspan x="68" dy="0">ENGLISH EDITION</tspan></text><text x="68" y="125" font-size="44" font-weight="700" fill="#20364c"><tspan x="68" dy="0">Review and checks before push</tspan></text><rect x="68" y="160" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="208" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">1. Review the complete diff</tspan></text><text x="96" y="279" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">The code-review agent reads origin/develop...HEAD. Each finding</tspan><tspan x="96" dy="41">records severity, confidence, a reason, and the affected behavior.</tspan></text><path d="M540 359 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="392" width="944" height="231" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="440" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">2. Fix critical findings</tspan></text><text x="96" y="511" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Critical findings go back to implementation. The agent fixes them and</tspan><tspan x="96" dy="41">repeats the relevant checks and review; unresolved critical findings</tspan><tspan x="96" dy="41">stop the push.</tspan></text><path d="M540 632 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="665" width="944" height="190" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="713" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">3. Verify changed behavior</tspan></text><text x="96" y="784" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Run the checks selected for the changed files: tests, lint, typecheck,</tspan><tspan x="96" dy="41">and unused-code checks. Failed checks stop progress.</tspan></text><path d="M540 864 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="897" width="944" height="190" rx="18" fill="#edf3f8" stroke="#ccd6df" stroke-width="2"/><text x="96" y="945" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">4. Push and create the PR</tspan></text><text x="96" y="1016" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">Push only after the review and required checks have passed. Open</tspan><tspan x="96" dy="41">the PR against the intended integration branch.</tspan></text><path d="M540 1096 v20 m-9 -9 l9 9 9 -9" fill="none" stroke="#8199ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="1129" width="944" height="231" rx="18" fill="#fff" stroke="#ccd6df" stroke-width="2"/><text x="96" y="1177" font-size="32" font-weight="700" fill="#234969"><tspan x="96" dy="0">5. CI checks the full result</tspan></text><text x="96" y="1248" font-size="29" font-weight="400" fill="#40566b"><tspan x="96" dy="0">CI performs its independent checks. Related implementation stays in</tspan><tspan x="96" dy="41">the same session so follow-up findings can be resolved against the</tspan><tspan x="96" dy="41">same diff.</tspan></text><text x="68" y="1433" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">English diagram redrawn from the original illustration.</tspan></text><text x="68" y="1470" font-size="24" font-weight="400" fill="#667987"><tspan x="68" dy="0">Example values are illustrative; the original image remains archived.</tspan></text></g></svg>
