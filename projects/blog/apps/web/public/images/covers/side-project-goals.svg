<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>From needing all three reasons to starting with one</title>
  <desc>On the left, three linked slots that all had to be filled sit above a plan sheet drawn only in dashed lines. On the right, four project cards are built with only one or two of the three slots filled in solid and the rest left pale. An editorial illustration, not a product screenshot.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 H 0 V 30" fill="none" stroke="#dddcd4" stroke-width="1" opacity=".45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6a7873" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f3f1e9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Before: all three slots had to be filled, so the project stayed a plan -->
  <rect x="110" y="110" width="300" height="92" rx="46" fill="#fffef9" stroke="#b6c0b9" stroke-width="2"/>
  <path d="M 206 156 H 234 M 286 156 H 314" stroke="#6a7873" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fffef9" stroke-width="4">
    <circle cx="180" cy="156" r="24" stroke="#a85f43"/>
    <circle cx="260" cy="156" r="24" stroke="#c0933a"/>
    <circle cx="340" cy="156" r="24" stroke="#4f786a"/>
  </g>
  <rect x="110" y="240" width="300" height="280" rx="12" fill="#f8f6ef" stroke="#a85f43" stroke-width="3" stroke-dasharray="10 9"/>
  <rect x="140" y="272" width="240" height="96" rx="8" fill="none" stroke="#d9bfb3" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M 140 404 H 350 M 140 440 H 380 M 140 476 H 300" fill="none" stroke="#d9bfb3" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12"/>

  <path d="M 444 315 H 524" fill="none" stroke="#6a7873" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Now: four built projects -->
  <g fill="#fffef9" stroke="#b6c0b9" stroke-width="2">
    <rect x="560" y="110" width="250" height="190" rx="12"/>
    <rect x="840" y="110" width="250" height="190" rx="12"/>
    <rect x="560" y="330" width="250" height="190" rx="12"/>
    <rect x="840" y="330" width="250" height="190" rx="12"/>
  </g>
  <g fill="#f3f1e9" stroke="#c8d1c8" stroke-width="1.5">
    <rect x="580" y="128" width="104" height="34" rx="17"/>
    <rect x="860" y="128" width="104" height="34" rx="17"/>
    <rect x="580" y="348" width="104" height="34" rx="17"/>
    <rect x="860" y="348" width="104" height="34" rx="17"/>
  </g>
  <!-- Slots in the order interest, money, study -->
  <!-- Pale slots are not the main reason, though they are not absent either -->
  <g fill="#f0d9cf">
    <circle cx="602" cy="145" r="10"/>
    <circle cx="882" cy="145" r="10"/>
    <circle cx="882" cy="365" r="10"/>
  </g>
  <g fill="#f1e3bd">
    <circle cx="632" cy="145" r="10"/>
    <circle cx="912" cy="145" r="10"/>
    <circle cx="632" cy="365" r="10"/>
  </g>
  <circle cx="942" cy="365" r="10" fill="#d5e3d8"/>
  <circle cx="662" cy="145" r="10" fill="#4f786a"/>
  <circle cx="942" cy="145" r="10" fill="#4f786a"/>
  <circle cx="602" cy="365" r="10" fill="#a85f43"/>
  <circle cx="662" cy="365" r="10" fill="#4f786a"/>
  <circle cx="912" cy="365" r="10" fill="#c0933a"/>

  <!-- Blog: lines of writing and a pencil -->
  <path d="M 612 200 H 742 M 612 226 H 762 M 612 252 H 712" fill="none" stroke="#c8d1c8" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(775 172) rotate(35) scale(.55)">
    <path d="M 0 0 H 19 V 152 L 10 174 L 0 152 Z" fill="#c48a60" stroke="#765d47" stroke-width="3"/>
    <path d="M 0 149 H 19 L 10 174 Z" fill="#ead6b8"/>
    <path d="M 6 165 L 10 174 L 14 165 Z" fill="#36463d"/>
  </g>

  <!-- Two services: a photo and a conversation -->
  <rect x="876" y="186" width="96" height="76" rx="8" fill="#fffef9" stroke="#4f786a" stroke-width="3"/>
  <path d="M 884 254 L 910 220 L 930 242 L 944 228 L 964 254 Z" fill="#bacbc0"/>
  <circle cx="950" cy="204" r="7" fill="#c0933a"/>
  <path d="M 998 212 H 1046 A 12 12 0 0 1 1058 224 V 246 A 12 12 0 0 1 1046 258 H 1012 L 998 272 V 258 A 12 12 0 0 1 986 246 V 224 A 12 12 0 0 1 998 212 Z" fill="#fffef9" stroke="#6a7873" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 1000 228 H 1044 M 1000 242 H 1030" fill="none" stroke="#c8d1c8" stroke-width="5" stroke-linecap="round"/>

  <!-- Game AI: a trophy -->
  <path d="M 655 420 C 630 420 632 452 660 454 M 715 420 C 740 420 738 452 710 454" fill="none" stroke="#765d47" stroke-width="3" stroke-linecap="round"/>
  <path d="M 655 408 H 715 V 440 A 30 30 0 0 1 655 440 Z" fill="#ead6b8" stroke="#765d47" stroke-width="3" stroke-linejoin="round"/>
  <rect x="679" y="470" width="12" height="18" fill="#c48a60" stroke="#765d47" stroke-width="2"/>
  <rect x="659" y="488" width="52" height="12" rx="3" fill="#c48a60" stroke="#765d47" stroke-width="2"/>

  <!-- Studio: a screen with a play button -->
  <rect x="905" y="402" width="120" height="84" rx="10" fill="#fffef9" stroke="#4f786a" stroke-width="3"/>
  <path d="M 954 426 L 984 444 L 954 462 Z" fill="#4f786a" stroke="#4f786a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 965 486 V 500 M 943 500 H 987" fill="none" stroke="#6a7873" stroke-width="3" stroke-linecap="round"/>
</svg>
