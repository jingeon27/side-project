<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Reviewing code and writing</title>
  <desc>Code and prose drafts are annotated at a review desk before reaching a reader. An editorial diagram, not a product screenshot.</desc>
