<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Tracing one test line back to its pull request and issue</title>
  <desc>A test file card with one highlighted, passing line. A dashed path leads from that line to a merged pull request card and then to an older issue card. A small dropdown menu sits beside the test file. An editorial diagram, not a product screenshot.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 H 0 V 30" fill="none" stroke="#dddcd4" stroke-width="1" opacity="0.7" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2a37" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#f6f5f0" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Test file -->
  <g filter="url(#shadow)">
    <rect x="90" y="96" width="420" height="438" rx="18" fill="#ffffff" stroke="#d7d9de" stroke-width="2" />
  </g>
  <rect x="90" y="96" width="420" height="52" rx="18" fill="#eef0f3" />
  <rect x="90" y="130" width="420" height="18" fill="#eef0f3" />
  <circle cx="122" cy="122" r="7" fill="#e5675c" />
  <circle cx="146" cy="122" r="7" fill="#e8b84a" />
  <circle cx="170" cy="122" r="7" fill="#5cb87a" />

  <g fill="#c9ced6">
    <rect x="130" y="182" width="190" height="14" rx="7" />
    <rect x="160" y="216" width="270" height="14" rx="7" />
    <rect x="160" y="250" width="220" height="14" rx="7" />
  </g>
  <rect x="112" y="284" width="376" height="52" rx="12" fill="#fff4d6" stroke="#e8b84a" stroke-width="2" />
  <circle cx="142" cy="310" r="13" fill="#2f855a" />
  <path d="M 135 310 L 140 316 L 150 304" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="168" y="303" width="250" height="14" rx="7" fill="#8a6d1f" opacity="0.55" />
  <g fill="#c9ced6">
    <rect x="160" y="358" width="240" height="14" rx="7" />
    <rect x="160" y="392" width="300" height="14" rx="7" />
    <rect x="130" y="426" width="150" height="14" rx="7" />
  </g>

  <!-- Dropdown beside the test -->
  <g filter="url(#shadow)">
    <rect x="300" y="452" width="150" height="40" rx="10" fill="#ffffff" stroke="#b9bfc8" stroke-width="2" />
  </g>
  <rect x="318" y="466" width="74" height="12" rx="6" fill="#9aa2ad" />
  <path d="M 414 468 L 422 476 L 430 468" fill="none" stroke="#5b6472" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <g filter="url(#shadow)">
    <rect x="300" y="500" width="190" height="104" rx="12" fill="#ffffff" stroke="#d7d9de" stroke-width="2" />
  </g>
  <rect x="312" y="512" width="166" height="26" rx="7" fill="#eef0f3" />
  <rect x="324" y="519" width="90" height="12" rx="6" fill="#7b8491" />
  <rect x="324" y="553" width="110" height="12" rx="6" fill="#9aa2ad" />
  <rect x="324" y="581" width="76" height="12" rx="6" fill="#d9534f" opacity="0.8" />

  <!-- Path back through history -->
  <path d="M 488 310 C 560 310, 560 232, 620 232" fill="none" stroke="#5b6472" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)" />
  <path d="M 820 290 C 860 330, 860 382, 884 392" fill="none" stroke="#5b6472" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)" />

  <!-- Pull request -->
  <g filter="url(#shadow)">
    <rect x="628" y="170" width="250" height="140" rx="16" fill="#ffffff" stroke="#d7d9de" stroke-width="2" />
  </g>
  <circle cx="672" cy="206" r="9" fill="none" stroke="#6b46c1" stroke-width="4" />
  <circle cx="672" cy="262" r="9" fill="none" stroke="#6b46c1" stroke-width="4" />
  <circle cx="712" cy="262" r="9" fill="none" stroke="#6b46c1" stroke-width="4" />
  <path d="M 672 215 L 672 253" stroke="#6b46c1" stroke-width="4" />
  <path d="M 676 212 C 712 222, 712 236, 712 253" fill="none" stroke="#6b46c1" stroke-width="4" />
  <rect x="740" y="198" width="110" height="14" rx="7" fill="#c9ced6" />
  <rect x="740" y="226" width="84" height="14" rx="7" fill="#c9ced6" />
  <rect x="740" y="254" width="100" height="14" rx="7" fill="#d9cdf2" />

  <!-- Issue -->
  <g filter="url(#shadow)">
    <rect x="892" y="330" width="230" height="150" rx="16" fill="#ffffff" stroke="#d7d9de" stroke-width="2" />
  </g>
  <circle cx="938" cy="374" r="16" fill="none" stroke="#c05621" stroke-width="4" />
  <circle cx="938" cy="374" r="4.5" fill="#c05621" />
  <rect x="970" y="366" width="118" height="14" rx="7" fill="#c9ced6" />
  <rect x="918" y="410" width="170" height="12" rx="6" fill="#dfe2e7" />
  <rect x="918" y="434" width="140" height="12" rx="6" fill="#dfe2e7" />
  <rect x="918" y="458" width="96" height="12" rx="6" fill="#f3d6c3" />
</svg>
