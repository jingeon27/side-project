<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>트로피전 화면 라벨링</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>트로피전 화면 라벨링</h1>
        <nav aria-label="라벨 대기열">
          <label
            >대기열
            <select id="split">
              <option value="measurement">블라인드 측정</option>
              <option value="coverage">카드 커버리지</option>
            </select></label
          ><label
            >작업
            <select id="mode">
              <option value="queue">새 화면</option>
              <option value="confirm">AI 라벨 독립 확인</option>
              <option value="repeat">이틀 뒤 재판독</option>
            </select></label
          >
        </nav>
      </header>
      <section class="workspace">
        <figure>
          <div class="board">
            <img id="frame" alt="판독할 트로피전 화면" /><canvas
              id="marks"
              width="368"
              height="652"
              aria-hidden="true"
            ></canvas>
          </div>
          <figcaption id="which">대기열을 불러오는 중</figcaption>
        </figure>
        <form id="review">
          <fieldset>
            <legend>필드</legend>
            <div class="row">
              <label
                >대상
                <select id="type">
                  <option value="objects">유닛 · 건물</option>
                  <option value="effects">주문 · 효과</option>
                  <option value="opponentPlays">상대 카드 사용</option>
                </select></label
              ><label
                >이름 <input id="kind" list="ids" value="unsure" autocomplete="off" /><datalist
                  id="ids"
                ></datalist></label
              ><label
                >진영
                <select id="side">
                  <option value="unsure">불확실</option>
                  <option value="blue">아군</option>
                  <option value="red">상대</option>
                </select></label
              >
            </div>
            <div class="row">
              <label
                >형태
                <select id="form"></select></label
              ><label
                >체력
                <select id="health"></select
              ></label>
            </div>
            <p>화면에서 발이나 효과 중심을 누르세요. 키보드로도 좌표를 입력할 수 있습니다.</p>
            <div class="row">
              <label>X <input id="x" type="number" min="0" max="367" /></label
              ><label>Y <input id="y" type="number" min="0" max="651" /></label
              ><button type="button" id="place">점 추가</button>
            </div>
            <ul id="points"></ul>
            <label><input type="checkbox" id="objectsComplete" /> 보이는 유닛·건물을 모두 기록함</label
            ><label><input type="checkbox" id="effectsComplete" /> 보이는 효과를 모두 기록함</label>
          </fieldset>
          <fieldset>
            <legend>손패와 엘릭서</legend>
            <div id="slots"></div>
            <div class="row">
              <label
                >다음 카드
                <select id="next"></select></label
              ><label
                >엘릭서
                <select id="mana"></select
              ></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>보이는 타워 체력</legend>
            <div class="towers" id="towers"></div>
          </fieldset>
          <footer>
            <button id="save" type="submit">라벨 저장 · 다음 화면</button
            ><output id="status" aria-live="polite"></output>
          </footer>
        </form>
      </section>
    </main>
    <script type="module" src="/review.js"></script>
  </body>
</html>
